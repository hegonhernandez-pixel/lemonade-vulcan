function autoAlto(ta) { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + 2 + "px"; }

function avisoGuionCorto(total, formato, dur) {
  if (total <= 0 || dur >= (formato === "largo" ? 480 : 45)) return null;
  return T("guion.av_corto", { dur: mmss(dur), recomendacion: T(formato === "largo" ? "guion.recomendacion_largo" : "guion.recomendacion_short") });
}

/** Refresca miniaturas, duraciones, métricas y la vista previa sin tocar los textarea (no se pierde el foco). */
function actualizarEstados() {
  if (!S.slug) return;
  const d = S.doc, est = S.det?.escenas || [];
  const t = $("#gTitulo");
  if (t) t.textContent = d.titulo || d.tema || S.slug;

  let total = 0, dur = 0, conocida = true;
  $$("#guionCuerpo .escena").forEach(card => {
    const i = +card.dataset.i, e = d.escenas[i], s = est[i] || {};
    $('[data-subida-propia]', card).hidden = !(S.subiendoPropio && S.propioObjetivo?.escena === e);
    const n = palabras(e.texto);
    total += n;
    if (s.duracion != null) dur += s.duracion; else { conocida = false; dur += n / 2.4; }
    const o = ocupado(i + 1);
    const mini = $("[data-mini]", card);
    const bajando = o.img === "corriendo" && S.descarga;
    const capa = o.img ? `<div class="capa"><span class="giro"></span>${bajando ? T("mini.descargando_html", { gb: S.descarga.gb.toFixed(1), total: S.descarga.total })
      : o.img === "corriendo" ? T(s.calidad === "alta" ? "mini.generando_alta_html" : "mini.generando") : T("mini.en_cola")}</div>` : "";
    // etiqueta de calidad: ALTA si la imagen lo es; gris si la que se ve no es la que se usará al producir
    const q = s.media ? `<span class="q propia" title="${esc(s.media.nombre)}">${T(s.media.falta ? "mini.falta_archivo" : s.media.tipo === "clip" ? "mini.clip_propio" : "mini.imagen_propia")}</span>`
      : s.img && (s.calidad_img === "alta" || s.calidad_img !== s.calidad)
      ? `<span class="q ${s.calidad_img !== s.calidad ? "otra" : ""}" title="${s.calidad_img !== s.calidad ? T("mini.al_producir", { calidad: T(s.calidad === "alta" ? "cal.alta" : "cal.rapida") }) : T("mini.alta_d")}">${T(s.calidad_img === "alta" ? "mini.ALTA" : "mini.RAPIDA")}</span>` : "";
    const src = s.img || "";
    const descarga = $("[data-descargar-imagen]", card);
    const original = !s.media?.falta && s.media?.tipo !== "clip" ? s.media?.url || src : "";
    descarga.hidden = !original;
    if (original) descarga.href = original; else descarga.removeAttribute("href");
    if (mini.dataset.src !== src || mini.dataset.capa !== capa || mini.dataset.q !== q || mini.dataset.prompt !== e.prompt) {
      mini.dataset.prompt = e.prompt;
      mini.dataset.src = src; mini.dataset.capa = capa; mini.dataset.q = q;
      mini.innerHTML = (src ? `<img src="${esc(src)}" alt="" loading="lazy" ${s.media?.tipo === "clip" ? `data-clip="${esc(s.media.url || "")}"` : ""}>`
        : s.media?.falta ? `<div class="vacio falta"><span>${esc(s.media.nombre)}</span><button class="btn primario" data-accion="${s.media.tipo === "clip" ? "propio-video" : "propio"}">${T("escena.volver_subir")}</button></div>`
        : `<div class="vacio">${T(e.prompt ? "mini.sin_imagen" : "mini.falta_prompt")}</div>`) + q + capa;
    }
    const vozTxt = o.voz ? `<span class="voz-pend">${T(o.voz === "corriendo" ? "escena.voz_generando" : "escena.voz_cola")}</span>`
      : s.duracion != null ? `${s.duracion.toFixed(1)} s` : (e.texto ? `<span class="voz-pend">${T("escena.sin_voz", { s: (n / 2.4).toFixed(0) })}</span>` : "");
    $("[data-meta]", card).innerHTML = `<span class="${n > 40 ? "largo" : ""}">${T("escena.palabras", { n })}</span>${vozTxt ? `<span>${vozTxt}</span>` : ""}`;
    $('[data-accion="voz"]', card).disabled = !s.voz;
    const menu = $(".menu-img", card);
    menu.hidden = !src && !e.media;
    const generarFaltante = $("[data-falta-imagen]", card);
    generarFaltante.hidden = false;
    generarFaltante.disabled = !e.prompt?.trim() || !!o.img || !!S.subiendoPropio;
    generarFaltante.title = !e.prompt?.trim() ? T("mini.falta_prompt") : "";
    const sinMenu = (!e.prompt && !e.media) || !!o.img;
    menu.classList.toggle("deshab", sinMenu);
    if (sinMenu) menu.open = false;
    $$("[data-generada]", menu).forEach(b => b.hidden = !!e.media);
    $("[data-propia]", menu).hidden = !e.media;
    $("[data-propia]", menu).innerHTML = s.media?.tipo === 'clip'
      ? `${T('clip.quitar')}<small>${T('clip.sin_ia')}</small>`
      : `${T('escena.quitar_propio')}<small>${T('escena.quitar_propio_d')}</small>`;
    $("summary", menu).title = T(e.media ? "escena.archivo_propio" : s.img ? "escena.otra_version" : "escena.generar_imagen");
    $('[data-accion="propio"]', card).title = T(e.media ? "escena.cambiar_propio" : "escena.subir_propio");
    $('[data-accion="propio"]', card).textContent = T("escena.subir_imagen");
    const videoBtn = $('[data-accion="propio-video"]', card);
    videoBtn.textContent = T(s.media?.tipo === "clip" ? "clip.reemplazar" : "clip.subir");
    $('[data-accion="propio"]', card).disabled = videoBtn.disabled = !!S.subiendoPropio || !!o.img;
    const clipCaja = $('[data-clip-opciones]', card), esClip = s.media?.tipo === "clip";
    clipCaja.hidden = !esClip;
    if (esClip) {
      const tiempo = s.media.duracion;
      $('[data-clip-duracion]', card).textContent = Number.isFinite(tiempo) ? T('clip.duracion', { s:tiempo.toFixed(2) }) : T('clip.sin_duracion');
      $('[data-clip-aviso]', card).textContent = s.media.error || T('clip.ajuste');
      const inicio = $('[data-inicio-clip]', card);
      if (document.activeElement !== inicio) inicio.value = e.inicio_clip || 0;
      if (Number.isFinite(tiempo)) inicio.max = Math.max(0, tiempo - .001).toFixed(3); else inicio.removeAttribute('max');
      inicio.disabled = !!s.media.falta || !!s.media.error || !!o.img || !!S.subiendoPropio;
      $('[data-accion="ver-video"]', card).disabled = !!s.media.falta || !!s.media.error;
      $('[data-accion="quitar-video"]', card).disabled = !!o.img || !!S.subiendoPropio;
    }
    const pz = $("[data-pausa]", card);
    if (document.activeElement !== pz && +pz.value !== (e.pausa || 0)) pz.value = e.pausa || 0;
    $("[data-qajuste]", card).textContent = T("escena.calidad_ajustes", { calidad: T(S.ajustes.calidad === "alta" ? "cal.alta" : "cal.rapida") });
    const visual = !e.media && s.presupuesto_visual, pl = $("[data-prompt-largo]", card);
    pl.hidden = !visual;
    pl.textContent = visual ? resumenPresupuestoVisual(visual, true) : "";
  });

  const m = $("#gMetricas");
  if (m) {
    const corto = d.formato !== "largo";
    const malo = corto ? total > 140 : (total < 1200 || total > 1800);
    m.innerHTML = `<span><b>${d.escenas.length}</b> ${T("guion.escenas")}</span>
      <span class="${malo ? "mal" : ""}"><b>${total}</b> ${T("guion.palabras")} <span class="nota">(${T(corto ? "guion.ideal_short" : "guion.ideal_largo")})</span></span>
      <span><b>${conocida ? "" : "~"}${mmss(dur)}</b> ${T("guion.de_voz")}</span>`;
  }
  const av = [];
  const avisoDuracion = avisoGuionCorto(total, d.formato, dur);
  if (avisoDuracion) av.push(["", avisoDuracion]);
  if (S.det?.error_guion) av.push(["error", S.det.error_guion]);
  d.escenas.forEach((e, i) => {
    if ((e.texto || "").includes("// VERIFICAR")) av.push(["error", T("escena.av_verificar", { n: i + 1 })]);
    else if (!e.texto?.trim() || !(e.prompt?.trim() || e.media)) av.push(["", T(!e.texto?.trim() ? "escena.av_falta_texto" : "escena.av_falta_prompt", { n: i + 1 })]);
    if (est[i]?.media?.falta) av.push(["error", T("escena.av_falta_archivo", { n: i + 1, media: e.media })]);
    const ms = e.media ? [] : mencionesDe(e.prompt);
    if (ms.length && PERS.lista && !PERS.lista.some(p => p.nombre === ms[0])) av.push(["error", T("escena.av_personaje_no", { n: i + 1, nombre: ms[0] })]);
    else if (ms.length > 1) av.push(["", T("escena.av_personaje_varios", { n: i + 1, nombre: ms[0] })]);
  });
  if (PERS.soloAlta && d.escenas.some(e => !e.media && mencionesDe(e.prompt).length))
    av.push(["", T("guion.av_personaje_alta")]);
  const ul = $("#gAvisos");
  if (ul) ul.innerHTML = av.map(([c, t]) => `<li class="${c}">${esc(t)}</li>`).join("");
  renderMusicaInfo();
  renderVista();
  renderMiniatura(false);
}

function moverEscena(i, j) {
  const e = S.doc.escenas, est = S.det.escenas;
  [e[i], e[j]] = [e[j], e[i]];
  if (est[i] && est[j]) [est[i], est[j]] = [est[j], est[i]];
  S.sucio = true;
  renderGuion();
  guardar();
}

async function accionEscena(accion, i) {
  const e = S.doc.escenas;
  if (accion === "subir" && i > 0) moverEscena(i, i - 1);
  if (accion === "bajar" && i < e.length - 1) moverEscena(i, i + 1);
  if (accion === "borrar") {
    if ((e[i].texto || e[i].prompt) && !await confirmarAccion(T("escena.confirmar_borrar", { n: i + 1 }), T("escena.borrar"))) return;
    e.splice(i, 1); S.det.escenas.splice(i, 1);
    S.sucio = true; renderGuion(); guardar();
  }
  if (accion === "anadir") {
    e.splice(i + 1, 0, { texto: "", prompt: "" });
    S.det.escenas.splice(i + 1, 0, {});
    S.sucio = true; renderGuion(); guardar();
    $(`.escena[data-i="${i + 1}"] textarea.texto`)?.focus();
  }
  if (accion === "imagen" || accion === "imagen-alta") {
    if (e[i].media) {
      if (!await confirmarAccion(T('clip.usar_ia'), T('escena.generar_ia'))) return;
      if (S.doc.escenas !== e) return;
      delete e[i].media; delete e[i].inicio_clip;
    }
    $(`.escena[data-i="${i}"] .menu-img`)?.removeAttribute("open");
    const alta = accion === "imagen-alta", s = S.det.escenas[i] || {};
    // otra versión (semilla nueva) salvo cuando aún no hay imagen de la calidad pedida
    const yaHay = s.img && s.calidad_img === (alta ? "alta" : S.ajustes.calidad);
    if (alta) e[i].calidad = "alta"; else delete e[i].calidad;  // "alta" queda fijada en el guion para esa escena
    if (yaHay) e[i].semilla = (e[i].semilla || 0) + 1;
    S.sucio = true;
    generar("imagen", i + 1);
  }
  if (accion === "propio" || accion === "propio-video") {
    if (S.subiendoPropio) return;
    S.propioIdx = i;
    S.propioObjetivo = { slug:S.slug, doc:S.doc, escena:e[i] };
    $('#fPropio').accept = accion === 'propio-video' ? '.mp4,.mov,video/mp4,video/quicktime' : '.jpg,.jpeg,.png,image/jpeg,image/png';
    $("#fPropio").click();
  }
  if (accion === 'ver-video') {
    const media = S.det.escenas[i]?.media;
    if (media?.url && !media.falta) verClip(media.url, e[i].inicio_clip || 0);
  }
  if (accion === 'quitar-video' || (accion === 'quitar-propio' && /\.(mp4|mov)$/i.test(e[i].media || ''))) {
    if (!await confirmarAccion(T('clip.confirmar_quitar'), T('clip.quitar'))) return;
    if (S.doc.escenas !== e) return;
    delete e[i].media; delete e[i].inicio_clip;
    S.sucio = true; await guardar(); renderGuion();
    toast(T('clip.quitado'), 'ok');
    return;
  }
  if (accion === "quitar-propio") {
    $(`.escena[data-i="${i}"] .menu-img`)?.removeAttribute("open");
    delete e[i].media;
    delete e[i].inicio_clip;
    S.sucio = true;
    await guardar();
    if (e[i].prompt?.trim()) generar("imagen", i + 1);  // si ya estaba generada sale de caché
  }
  if (accion === "voz") {
    const src = S.det.escenas[i]?.voz;
    if (!src) return;
    if (S.audio && !S.audio.paused && S.audioSrc === src) { S.audio.pause(); return; }
    S.audio?.pause();
    S.audio = new Audio(src);
    S.audioSrc = src;
    S.audio.play().catch(() => toast(T("escena.no_suena"), "error"));
  }
}

/** Sube una imagen o clip propio para la escena i y lo anota en el guion ("media"). */
async function subirPropio(archivo, i) {
  if (!archivo || S.subiendoPropio) return;
  const objetivo = S.propioObjetivo || { slug:S.slug, doc:S.doc, escena:S.doc?.escenas[i] };
  const { slug, doc, escena } = objetivo;
  if (!escena || S.doc !== doc || S.slug !== slug || !doc.escenas.includes(escena)) return;
  if (archivo.size > 250 * 1024 * 1024) { toast(T('clip.tamano'), 'error'); return; }
  if (escena.media && !await confirmarAccion(T('clip.confirmar_reemplazar'), T('clip.reemplazar_archivo'))) return;
  if (S.doc !== doc || !doc.escenas.includes(escena)) return;
  S.subiendoPropio = true;
  actualizarEstados();
  try {
    await guardar();
    if (S.doc !== doc || S.slug !== slug || !doc.escenas.includes(escena)) return;
    const fd = new FormData(); fd.append("archivo", archivo);
    toast(T("clip.validando", { nombre:archivo.name }));
    const r = await fetch(`/api/guiones/${encodeURIComponent(slug)}/propios`, { method:"POST", body:fd, headers:cabeceras() });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(errorHttp(data, r.status));
    if (S.doc !== doc || S.slug !== slug || !doc.escenas.includes(escena)) { toast(T('clip.escena_cambio'), 'error'); return; }
    escena.media = data.media;
    delete escena.inicio_clip;
    S.sucio = true;
    await guardar();
    if (S.doc !== doc || S.sucio || escena.media !== data.media) return;
    renderGuion();
    const idx = doc.escenas.indexOf(escena), voz = S.det.escenas[idx]?.duracion;
    const p = { n:idx + 1, dur:data.duracion?.toFixed(1), voz:voz?.toFixed(1) };
    toast(data.tipo !== "clip" ? T("propio.imagen", p)
      : !voz ? T("propio.clip", p) : T(data.duracion > voz ? "propio.clip_corta" : "propio.clip_congela", p), "ok");
  } catch (err) { toast(err.message, "error"); }
  finally { S.subiendoPropio = false; if (S.slug) actualizarEstados(); }
}

function verClip(url, inicio = 0) {
  const dlg = document.createElement('dialog');
  dlg.className = 'modal clip-preview';
  dlg.setAttribute('aria-label', T('clip.preview'));
  dlg.innerHTML = `<div class="fila"><h3>${esc(T('clip.preview'))}</h3><button type="button" class="btn chico" autofocus>${esc(T('clip.cerrar'))}</button></div><video controls muted playsinline preload="metadata"></video>`;
  const video = $('video', dlg);
  video.src = url;
  video.onloadedmetadata = () => { if (inicio < video.duration) video.currentTime = inicio; };
  $('button', dlg).onclick = () => dlg.close();
  dlg.onclose = () => { video.pause(); video.removeAttribute('src'); video.load(); dlg.remove(); };
  document.body.append(dlg); dlg.showModal();
}

// ---------------- columna 3: Vista previa ----------------
function renderVista() {
  const cont = $("#vistaCuerpo");
  if (!S.slug) { cont.innerHTML = `<div class="reproductor vertical"><div class="sin">${T("vista.aqui")}</div></div>`; return; }
  const d = S.doc, det = S.det, v = det.video;
  const vertical = d.formato !== "largo";
  const ts = det.trabajos || [];
  const tv = [...ts].reverse().find(t => t.tipo === "video");
  const ultimo = ts[ts.length - 1];
  const generando = tv && (tv.estado === "en cola" || tv.estado === "corriendo");
  const completo = d.escenas.length && d.escenas.every(e => e.texto?.trim() && (e.prompt?.trim() || e.media));

  // el <video> solo se reemplaza si cambió el archivo: si no, se cortaría la reproducción en cada sondeo
  let rep = $("#reproductor");
  const clave = `${v?.url || ""}|${vertical}|${LANG}`;
  if (!rep || rep.dataset.clave !== clave) {
    cont.innerHTML = `
      <div class="reproductor ${vertical ? "vertical" : "horizontal"}" id="reproductor" data-clave="${esc(clave)}">
        ${v ? `<video src="${esc(v.url)}#t=0.1" controls playsinline preload="metadata"></video>` : `<div class="sin">${T("vista.sin_video_html")}</div>`}
      </div>
      <div id="vistaDinamica"></div>
      <div id="miniaturaCaja"></div>`;
    renderMiniatura(true);
  }
  const pasosHtml = tv ? tv.pasos.map(p => {
    const ic = { ok: "✓", cache: "↺", error: "✕", corriendo: '<span class="giro"></span>', pendiente: "○" }[p.estado] || "○";
    const seg = p.estado === "cache" ? T("vista.cache") : p.segundos != null ? `${p.segundos}s` : "";
    return `<li class="${p.estado}"><span class="ic">${ic}</span><span>${esc(p.nombre)}</span><span class="seg">${seg}</span></li>`;
  }).join("") : "";
  const pct = tv ? Math.round(tv.progreso * 100) : 0;
  const durTrabajo = tv?.inicio ? Math.round((tv.fin || Date.now() / 1000) - tv.inicio) : null;
  const logT = ultimo;
  const dyn = $("#vistaDinamica");
  const abiertoLog = $("details.log", dyn)?.open ?? false;
  dyn.innerHTML = `
    ${v ? `<div class="video-info"><span>${mmss(v.duracion)} · ${hace(v.fecha)}</span>
      ${v.desactualizado ? `<span class="badge b-generando" title="${T("vista.desactualizado_d")}">${T("vista.desactualizado")}</span>` : `<span class="badge b-listo">${T("vista.listo")}</span>`}</div>` : ""}

let SUBS = null;  // catálogo: fuentes, tamaños, posiciones, valores por defecto
const POS_TXT = p => T(`pos.${p}`);
const TAM_TXT = t => T(`tam.${t}`);

function cargarFuentesCss() {

/** Estilos rápidos de Ajustes → Subtítulos. Lo que no traen sale de SUBS.defecto (Clásico = el defecto). */
const PRESETS_SUBS = [
  ["viral", { fuente: "montserrat", tamano: "grande", mayusculas: true, karaoke: true, borde: 32 }],
  ["limpio", { fuente: "poppins", tamano: "medio", mayusculas: false, karaoke: true, borde: 10 }],
  ["documental", { fuente: "oswald", tamano: "medio", posicion: "abajo", karaoke: false, sombra: true }],
  ["bold", { fuente: "anton", tamano: "muy_grande", mayusculas: true, karaoke: true, color: "#ffffff", color_borde: "#000000", borde: 28 }],
  ["clasico", {}],
];
const presetSubs = id => ({ ...SUBS.defecto, ...PRESETS_SUBS.find(p => p[0] === id)[1] });

/** Marca el chip cuyo estilo coincide del todo con 'v'; si el usuario tocó algo, ninguno. */
function marcarPresetSubs(el, v) {
  const chips = $$("[data-preset]", el);
  if (!chips.length) return;
  const igual = id => { const p = presetSubs(id); return Object.keys(p).every(k => p[k] === v[k]); };
  chips.forEach(c => c.classList.toggle("activa", igual(c.dataset.preset)));
}

function htmlControlesSubs(conPresets = false) {
  return `<div class="subs-ctl">

      <div class="chips">${PRESETS_SUBS.map(([id]) => `<button type="button" class="chip" data-preset="${id}">${T(`subs.preset.${id}`)}</button>`).join("")}</div></div>` : ""}
    <label class="campo"><span>${T("subs.fuente")}</span>
      <select data-k="fuente">${SUBS.fuentes.map(f => `<option value="${f.id}">${esc(f.nombre)}</option>`).join("")}</select>
      <div class="muestra" data-muestra></div></label>
    <label class="campo"><span>${T("subs.tamano")} <b data-tamtxt></b></span><input type="range" min="0" max="${SUBS.tamanos.length - 1}" step="1" data-k="tamano"></label>
    <div class="campo"><label class="campo" style="margin:0"><span>${T("subs.posicion")}</span></label>

    <div class="colores">
      <label>${T("subs.texto")} <input type="color" data-k="color"></label>
      <label>${T("subs.borde")} <input type="color" data-k="color_borde"></label>
    </div>
    <label class="campo"><span>${T("subs.grosor")} <b data-bordetxt></b></span><input type="range" min="0" max="40" step="1" data-k="borde"></label>
    <label class="campo"><span>${T("subs.sombra")}</span><select data-k="sombra">
      <option value="auto">${T("subs.sombra_auto")}</option><option value="si">${T("comun.Si")}</option><option value="no">${T("comun.No")}</option></select></label>

    <div class="fila" style="margin-top:10px">
      <button type="button" class="btn" data-preview>${T("subs.previsualizar")}</button>

function ponerSubs(el, v) {
  v = { ...SUBS.defecto, ...v };
  $('[data-k="fuente"]', el).value = v.fuente;
  $('[data-k="tamano"]', el).value = SUBS.tamanos.findIndex(t => t.id === v.tamano);
  $$('[data-k="posicion"] button', el).forEach(b => b.classList.toggle("activa", b.dataset.v === v.posicion));
  $('[data-k="color"]', el).value = v.color;
  $('[data-k="color_borde"]', el).value = v.color_borde;
  $('[data-k="borde"]', el).value = v.borde;
  $('[data-k="sombra"]', el).value = v.sombra == null ? "auto" : v.sombra ? "si" : "no";
  $('[data-k="mayusculas"]', el).checked = v.mayusculas;
  $('[data-k="karaoke"]', el).checked = v.karaoke;
  etiquetasSubs(el, v);
}

function leerSubs(el) {
  const sombra = $('[data-k="sombra"]', el).value;
  return {
    fuente: $('[data-k="fuente"]', el).value,
    tamano: SUBS.tamanos[+$('[data-k="tamano"]', el).value].id,
    posicion: $('[data-k="posicion"] button.activa', el)?.dataset.v || "centro_bajo",
    mayusculas: $('[data-k="mayusculas"]', el).checked,
    color: $('[data-k="color"]', el).value,
    color_borde: $('[data-k="color_borde"]', el).value,
    borde: +$('[data-k="borde"]', el).value,
    sombra: sombra === "auto" ? null : sombra === "si",
    karaoke: $('[data-k="karaoke"]', el).checked,
  };
}

function etiquetasSubs(el, v) {
  const t = SUBS.tamanos.find(x => x.id === v.tamano);
  $("[data-tamtxt]", el).textContent = `${TAM_TXT(v.tamano)} · ${t.px} px`;
  $("[data-bordetxt]", el).textContent = `${v.borde} px`;
  // muestra aproximada en el navegador (la vista previa real es la de ffmpeg)
  const m = $("[data-muestra]", el);
  const txt = v.mayusculas ? T("subs.muestra").toLocaleUpperCase(LANG) : T("subs.muestra");
  const pal = txt.split(" ");
  m.innerHTML = pal.map((p, i) => v.karaoke && i === 1 ? `<span class="k">${p}</span>` : p).join(" ");
  Object.assign(m.style, {
    fontFamily: `"sub-${v.fuente}"`, color: v.color,
    webkitTextStroke: v.borde ? `${Math.max(1, v.borde / 3.5).toFixed(1)}px ${v.color_borde}` : "0",
    textShadow: v.sombra ? "2px 3px 3px rgba(0,0,0,.6)" : "none",
  });
  marcarPresetSubs(el, v);
}

/** Conecta un bloque de controles: alCambiar(valores) en cada cambio; cuerpoPreview(valores) arma el pedido
 *  de vista previa, que se muestra en 'caja' (por defecto, la de dentro del bloque). */
function conectarSubs(el, alCambiar, cuerpoPreview, caja = $("[data-previewcaja]", el)) {
  const cambio = () => { const v = leerSubs(el); etiquetasSubs(el, v); alCambiar(v); };
  el.addEventListener("input", e => { if (e.target.matches("[data-k]")) cambio(); });
  el.addEventListener("change", e => { if (e.target.matches("[data-k]")) cambio(); });
  el.addEventListener("click", async e => {
    const pos = e.target.closest('[data-k="posicion"] button');
    if (pos) { $$('[data-k="posicion"] button', el).forEach(b => b.classList.toggle("activa", b === pos)); cambio(); }
    if (e.target.closest("[data-reset]")) { ponerSubs(el, SUBS.defecto); cambio(); }
    const preset = e.target.closest("[data-preset]");
    if (preset) {
      ponerSubs(el, presetSubs(preset.dataset.preset)); cambio();
      // si ya hay una vista previa real en pantalla, se rehace con el estilo nuevo
      if ($("img", caja)) $("[data-preview]", el).click();
    }
    const b = e.target.closest("[data-preview]");
    if (!b) return;
    b.disabled = true; b.innerHTML = `<span class="giro"></span> ${T("subs.renderizando")}`;
    try {
      const { data } = await api("POST", "/api/subtitulos/preview", cuerpoPreview(leerSubs(el)));
      caja.innerHTML = `<img src="${esc(data.url)}" alt="${T("subs.preview_alt")}">
        <p class="nota">${T("subs.preview_nota_html", { slug: esc(data.slug), s: data.segundos })}</p>`;
    } catch (err) { caja.innerHTML = `<div class="error-box">${esc(err.message)}</div>`; }
    finally { b.disabled = false; b.textContent = T("subs.previsualizar"); }
  });
  caja.addEventListener("click", e => { const img = e.target.closest("img"); if (img) verImagen(img.src); });
}

function ponerMarca(el, v) {

/** alCambiar(valores) en cada cambio (botones y slider). */
function conectarMarca(el, alCambiar) {

    $$("button", b.parentElement).forEach(x => x.classList.toggle("activa", x === b));

/** Si ya hay una vista previa de subtítulos en pantalla, se rehace: la marca de agua sale en ella.
 *  'ctl' es el bloque de controles de subtítulos; 'caja', donde está la imagen de la vista previa. */
const refrescarPreview = (() => {
  const timers = new WeakMap();
  return (ctl, caja) => {
    if (!ctl || !$("img", caja)) return;
    clearTimeout(timers.get(ctl));
    timers.set(ctl, setTimeout(() => $("[data-preview]", ctl)?.click(), 400));
  };
})();
const refrescarPreviewAjustes = () => refrescarPreview($("#aSubs2 .subs-ctl"), $("#aSubs2 [data-previewcaja]"));
const refrescarPreviewGuion = () => refrescarPreview($("#subsGuionCtl .subs-ctl"), $("#subsGuionCtl [data-previewcaja]"));

function renderMarcaAjustes(estilo = S.ajustes.estilo_marca || {}) {

    conectarMarca(cont.firstElementChild, refrescarPreviewAjustes);

  cont.hidden = !$("#aMarca").checked;

    : a.cierre_nombre ? T("cierre.nota_global_si", { nombre: a.cierre_nombre }) : T("cierre.nota_global_logo");
  const img = $("#cierrePreview");
  img.hidden = !(modo === "propio" && S.slug) && !(modo === "global" && a.cierre_tarjeta);
  if (modo === "global" && a.cierre_tarjeta) img.src = urlCierre(d.formato || a.formato, a.cierre_nombre);
  if (modo === "propio" && S.slug) img.src = `/propios/${encodeURIComponent(S.slug)}/${encodeURIComponent(c.split("/").pop())}?v=${S.cierreV || 0}`;
  $("#bCierreSubir").hidden = modo !== "propio";
}

/** Sube la imagen de la tarjeta de cierre (assets/propios/<slug>/cierre.png|jpg) y la anota en el guion. */
async function subirCierre(archivo) {
  if (!archivo) return;
  const { slug, doc } = S;
  if (!slug || !doc) { toast(T("cierre.sin_guardar"), "error"); return; }
  try {
    await guardar();
    await S.cadena;
    const fd = new FormData(); fd.append("archivo", archivo);
    const r = await fetch(`/api/guiones/${encodeURIComponent(slug)}/propios?destino=cierre`, { method:"POST", body:fd, headers:cabeceras() });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(errorHttp(data, r.status));
    if (S.doc !== doc || S.slug !== slug) return;
    doc.cierre = data.media;
    S.cierreV = Date.now();
    S.sucio = true;
    await guardar();
    renderCierreGuion();
    toast(T("cierre.subida"), "ok");
  } catch (err) { toast(err.message, "error"); }
}

/** Versión gratuita (app/licencia.py, LICENCIA_REQUERIDA = False): siempre se puede exportar.

function puedeExportar() { return true; }

// ---------------- configuración inicial (setup) ----------------
// Estado en /api/setup (app/preparar.py). Se muestra sola la primera vez en la app instalada.
const SETUP = { timer: null, falloConexion: false };
const COMPS_SETUP = ["ffmpeg", "ia", "turbo", "kokoro", "whisper", "base", "adapter"];
const tamGB = b => b >= 1e9 ? `${(b / 1e9).toFixed(1)} GB` : b > 0 ? `${Math.max(1, Math.round(b / 1e6))} MB` : "0 MB";
const durTxt = s => s >= 3600 ? `${Math.floor(s / 3600)} h ${Math.round(s % 3600 / 60)} min` : s >= 60 ? `${Math.round(s / 60)} min` : `${Math.round(s)} s`;

async function cargarSetup(fresco = false) {
  try {
    S.setup = (await api("GET", `/api/setup${fresco ? "?fresco=true" : ""}`)).data;
    SETUP.falloConexion = false;
    if (ruta().tab === "setup") renderSetup();
  } catch {
    const mensaje = T("comun.no_conecta", { error: T("setup.reintentar") });
    if (!SETUP.falloConexion) toast(mensaje, "error");
    SETUP.falloConexion = true;
    if (ruta().tab === "setup") $("#setupVerif").innerHTML = `<div class="caja-error">${esc(mensaje)}</div>`;
  } finally {
    programarSetup();
  }
}

function programarSetup() {
  clearTimeout(SETUP.timer);
  if (ruta().tab !== "setup") return;
  const activo = !SETUP.falloConexion && S.setup && ["descargando", "verificando"].includes(S.setup.fase);
  SETUP.timer = setTimeout(cargarSetup, activo ? 1000 : 6000);
}

function perfilSetup(e) {
  return "completo";
}
const compsDe = (e, perfil) => COMPS_SETUP.filter(c => e.componentes[c].perfiles.includes(perfil));
/** Lo que falta bajar de un perfil (solo lo que la app gestiona). */
function faltaPerfil(e, perfil) {
  return compsDe(e, perfil).map(c => e.componentes[c]).filter(c => c.gestionable && !c.presente)
    .reduce((s, c) => s + Math.max(0, c.total - c.hecho), 0);
}

function renderSetup() {
  const e = S.setup;
  if (!e) return;
  const q = e.equipo, g = q.gpu, mal = new Set(q.problemas);
  $("#setupDev").hidden = e.instalado;
  const fila = (etq, valor, ok, req) => `<div class="dato"><span>${etq}</span><span class="${ok ? "ok" : "mal"}">${ok ? "✓" : "⚠"} ${valor}${req ? `<small>${req}</small>` : ""}</span></div>`;
  $("#setupEquipo").innerHTML = (g ? fila(T("setup.gpu"), esc(g.nombre), true)
      + fila(T("setup.vram"), `${g.vram_gb} GB`, !mal.has("vram"), T("setup.req_vram", { n: q.requisitos.vram_gb }))
      + fila(T("setup.driver"), esc(g.driver), !mal.has("driver"), mal.has("driver") ? T("setup.req_driver", { n: q.requisitos.driver_min }) : "")
    : fila(T("setup.gpu"), T("setup.sin_gpu"), false))
    + fila(T("setup.disco"), `${q.disco_libre_gb} GB`, !mal.has("disco"), T("setup.req_disco", { n: q.requisitos.disco_gb }))
    + (q.cumple ? "" : `<div class="caja-aviso">${T("setup.no_cumple_html")}</div>`);

  const perfil = perfilSetup(e);
  const ocupado = ["descargando", "verificando"].includes(e.fase);
  $("#setupPerfiles").innerHTML = `<p class="nota">${T("setup.completo_d")}</p>`;

  const comps = compsDe(e, perfil);
  const todoPresente = comps.every(id => e.componentes[id].presente);
  let hecho = 0, total = 0;
  const filas = comps.map(id => {
    const c = e.componentes[id];
    const est = c.gestionable ? c.estado : (c.presente ? "listo" : "desarrollo");
    if (c.gestionable) { total += c.total; hecho += c.presente ? c.total : Math.min(c.hecho, c.total); }
    const pct = c.presente ? 100 : Math.round(100 * Math.min(c.hecho, c.total) / (c.total || 1));
    const tam = c.presente ? (c.exacto ? tamGB(c.total) : "") : c.hecho > 0 ? `${tamGB(Math.min(c.hecho, c.total))} / ${tamGB(c.total)}` : `${c.exacto ? "" : "~"}${tamGB(c.total)}`;
    return `<div class="comp"><span>${T(`setup.c.${id}`)}</span>
      <span class="estado ${est}">${T(`setup.e.${est}`)}${est === "descargando" ? ` · ${pct}%` : ""}${tam ? ` · ${tam}` : ""}</span>
      ${c.gestionable ? `<div class="barra"><i style="width:${pct}%"></i></div>` : ""}</div>`;
  }).join("");
  const falta = faltaPerfil(e, perfil);
  const vel = e.velocidad;
  const resumen = `<div class="setup-total"><span>${T("setup.total", { hecho: `<b>${tamGB(hecho)}</b>`, total: `<b>${tamGB(total)}</b>` })}</span>
    ${e.fase === "descargando" && vel ? `<span>${T("setup.velocidad", { v: tamGB(vel) })} · ${T("setup.quedan", { t: durTxt(falta / vel) })}</span>` : ""}</div>
    <div class="barra"><i style="width:${total ? Math.round(100 * hecho / total) : 0}%"></i></div>`;
  let acciones;
  if (e.fase === "descargando") acciones = `<button class="btn" data-setup="pausar">${T("setup.pausar")}</button>`;
  else if (todoPresente) acciones = `<span class="nota">${T("setup.nada")}</span>`;
  else {
    const etq = e.fase === "error" ? T("setup.reintentar") : e.fase === "pausado" ? T("setup.reanudar") : T("setup.iniciar", { total: tamGB(falta) });
    acciones = `<button class="btn primario" data-setup="iniciar" ${e.fase === "verificando" || !q.cumple ? "disabled" : ""}>${etq}</button>`
      + (e.fase === "pausado" ? `<span class="nota">${T("setup.pausa_nota")}</span>` : "");
  }
  const errDescarga = e.fase === "error" && !todoPresente ? `<div class="caja-error">${T("setup.error_html", { error: esc(e.error || "") })}</div>` : "";
  $("#setupDescargas").innerHTML = filas + resumen + `<div class="setup-acciones">${acciones}</div>` + errDescarga;

  // prueba final
  const v = e.verificacion, listoTodo = todoPresente;
  const verificada = v && v.ok && !v.solo_voz && ["ffmpeg", "voz", "imagen"].every(k => v.pasos?.[k]?.ok);
  let html = "";
  if (e.fase === "verificando") html = `<p class="nota"><span class="giro"></span> ${T("setup.verificando")}</p>`;
  else if (verificada && listoTodo) {
    const pa = v.pasos || {};
    const linea = (k, txt) => pa[k] ? `<div class="dato"><span>${T(`setup.v.${k}`)}</span><span class="ok">✓ ${txt}</span></div>` : "";
    html = `<div class="setup-listo">✓ ${T("setup.listo")}</div>`
      + linea("ffmpeg", esc(pa.ffmpeg?.version || ""))
      + linea("voz", pa.voz?.carga_s != null ? `${T("setup.v.carga", { s: pa.voz.carga_s })} · ${T("setup.v.gen", { s: pa.voz.sintesis_s })}` : T("setup.v.seg", { s: pa.voz?.segundos }))
      + linea("imagen", pa.imagen ? `${T("setup.v.carga", { s: pa.imagen.carga_s })} · ${T("setup.v.gen", { s: pa.imagen.imagen_s })}${pa.imagen.cuda ? "" : ` · ${T("setup.v.cpu")}`}` : "");
  } else if (v && !v.ok) {
    html = `<div class="caja-error">${T("setup.v.fallo_html", { error: esc(v.error || ""), log: esc(`${q.ruta_datos}\\logs\\server.log`) })}</div>`;
  }
  if (e.fase !== "verificando" && listoTodo && !verificada)
    html += `<div class="setup-acciones"><button class="btn primario" data-setup="verificar">${T("setup.verificar")}</button></div>`;
  $("#setupVerif").innerHTML = html;
  $("#bSetupEmpezar").disabled = ocupado || !listoTodo || !verificada;
}

/** completo=true reconstruye el formulario; si no, solo refresca imagen, estado y opciones (sin quitar el foco). */
function renderMiniatura(completo) {
  const caja = $("#miniaturaCaja");
  if (!caja || !S.slug) return;
  const d = S.doc, vertical = d.formato !== "largo";
  if (completo || !$("#fTituloMini", caja)) {
    caja.innerHTML = `
      <h3 class="sub">${T("miniatura.titulo")}</h3>
      <div class="mini-prev ${vertical ? "vertical" : "horizontal"}" id="miniPrev"></div>
      <label class="campo"><span>${T("miniatura.campo")} <span class="contador" id="miniCont"></span></span>
        <input id="fTituloMini" type="text" placeholder="${T("miniatura.ph")}">
        <span class="nota">${T("miniatura.nota")}</span></label>
      <label class="campo"><span>${T("miniatura.base")}</span><select id="fMiniEscena"></select></label>
      <div class="fila">
        <button class="btn" id="bMiniatura">${T("miniatura.regenerar")}</button>
        <a class="btn" id="bMiniDescargar" download="${esc(S.slug)}_miniatura.jpg">${T("comun.descargar")}</a>
      </div>`;
    $("#fTituloMini").value = d.titulo_miniatura || "";
  }
  const n = palabras((d.titulo_miniatura || "").replace(/\*/g, " "));
  const cont = $("#miniCont");
  cont.textContent = T("miniatura.contador", { n });
  cont.classList.toggle("mal", n > 6);

  const sel = $("#fMiniEscena");
  const opciones = d.escenas.map((e, i) => `<option value="${i + 1}">${T("miniatura.escena", { n: i + 1, texto: esc((e.texto || e.prompt || "").slice(0, 48)) })}</option>`).join("");
  if (sel.dataset.ops !== opciones && document.activeElement !== sel) { sel.dataset.ops = opciones; sel.innerHTML = opciones; }
  sel.value = String(Math.min(d.miniatura_escena || 1, d.escenas.length || 1));

  const m = S.det?.miniatura;
  const tm = [...(S.det?.trabajos || [])].reverse().find(t => t.tipo === "miniatura" || (t.tipo === "video" && t.pasos.some(p => p.id === "miniatura" && p.estado === "corriendo")));
  const activa = tm && (tm.estado === "en cola" || tm.estado === "corriendo");
  const capa = activa ? `<div class="capa"><span class="giro"></span>${T(tm.estado === "en cola" ? "mini.en_cola" : "mini.generando")}</div>` : "";
  const prev = $("#miniPrev");
  const clave = `${m?.url || ""}|${capa}|${LANG}`;
  if (prev.dataset.clave !== clave) {
    prev.dataset.clave = clave;
    prev.innerHTML = (m ? `<img src="${esc(m.url)}" alt="${T("miniatura.alt")}">` : `<div class="sin">${T("miniatura.sin_html")}</div>`) + capa;
  }
  if (tm?.tipo === "miniatura" && tm.estado === "error") toastUnaVez(tm.id, tm.error);
  $("#bMiniatura").disabled = activa || !d.escenas.length;
  const b = $("#bMiniDescargar");
  b.hidden = !m;
  if (m) b.href = m.url;
}

const _avisados = new Set();
function toastUnaVez(id, msg) { if (!_avisados.has(id)) { _avisados.add(id); toast(msg, "error"); } }

async function accionTarjeta(accion, slug) {
  const t = BIB.find(x => x.slug === slug);
  const nombre = t?.titulo || slug;
  try {
    if (accion === "duplicar") {
      const { data } = await api("POST", `/api/guiones/${encodeURIComponent(slug)}/duplicar`);
      toast(T("bib.duplicado", { slug: data.slug }), "ok");
    }
    if (accion === "borrar") {
      if (!await confirmarAccion(T("bib.confirmar_borrar", { nombre }), T("bib.borrar"))) return;
      const { data } = await api("POST", `/api/guiones/${encodeURIComponent(slug)}/borrar`);
      BIB = BIB.filter(x => x.slug !== slug);  // fuera de la lista ya, sin esperar al siguiente sondeo
      renderBiblioteca();
      if (S.slug === slug) { nuevo(); history.replaceState(null, "", "#/biblioteca"); }  // estaba abierto en "Nuevo video"
      toast(T("bib.a_papelera", { nombre }), "", { texto: T("bib.deshacer"), ms: 10000, fn: async () => {
        try { await api("POST", `/api/papelera/${encodeURIComponent(data.papelera)}/restaurar`); toast(T("bib.restaurado"), "ok"); }
        catch (e) { toast(e.message, "error"); }
        cargarBiblioteca();
      } });
    }
  } catch (e) { toast(e.message, "error"); }
  cargarBiblioteca();
}

// ---------------- personajes ----------------
const PERS = { lista: null, soloAlta: false, fuerza: { min: 0.4, max: 0.9, defecto: 0.65 }, maxFotos: 4,
  editando: null, conservar: [], nuevas: [] };  // formulario: fotos que se quedan + archivos nuevos
const mencionesDe = prompt => [...new Set([...(prompt || "").matchAll(/@([A-Za-z0-9][A-Za-z0-9_-]{0,31})/g)].map(m => m[1].toLowerCase()))];

async function cargarPersonajes() {
  try {
    const d = (await api("GET", "/api/personajes")).data;
    PERS.lista = d.personajes; PERS.soloAlta = d.solo_alta; PERS.segAlta = d.segundos_alta; PERS.fuerza = d.fuerza; PERS.maxFotos = d.max_fotos;
  } catch (e) { toast(e.message, "error"); return; }
  if (ruta().tab === "personajes") renderPersonajes();
}

function renderPersonajes() {
  $("#persSoloAlta").textContent = PERS.soloAlta ? T("pers.solo_alta", { s: PERS.segAlta }) : "";
  const lista = PERS.lista || [];
  $("#persLista").innerHTML = lista.length ? lista.map(p => {
    const simple = p.modalidad === "foto";
    const t = p.trabajo, activo = t && (t.estado === "en cola" || t.estado === "corriendo");
    const hechas = t ? t.pasos.filter(x => x.estado === "ok" || x.estado === "cache").length : 0;
    const capa = !activo ? "" : `<div class="capa"><span class="giro"></span>${t.estado === "en cola" ? T("pers.en_cola")
      : `${T("pers.probando", { min: Math.max(1, Math.round(((PERS.segAlta || 80) * 3 + 60) / 60))  /* + ~1 min de cargar el modelo */ })}<b class="pers-n">${Math.min(hechas + 1, 3)}/3</b>`}</div>`;
    return `<div class="tarjeta-pers ${PERS.editando === p.nombre ? "editando" : ""}" data-nombre="${esc(p.nombre)}">
      <div class="pers-cab"><img src="${esc(p.fotos[0]?.url || "")}" alt="">
        <div><h3>@${esc(p.nombre)}</h3><p>${esc(p.descripcion) || "—"}</p>
        <span class="nota">${Tn("pers.fotos_n", p.fotos.length)} · ${T("pers.fuerza_n", { f: p.fuerza.toFixed(2) })}</span></div></div>
      <div>
        <div class="pers-prueba">${simple ? `<img src="${esc(p.fotos[0]?.url || "")}" alt="">` : p.prueba ? `<img src="${esc(p.prueba.url)}" alt="">` : `<div class="sin">${T("pers.sin_prueba")}</div>`}${capa}</div>
        ${!simple && p.prueba ? `<div class="pers-poses"><span>${T("pers.pose_frente")}</span><span>${T("pers.pose_perfil")}</span><span>${T("pers.pose_cuerpo")}</span></div>` : ""}
        ${!simple && p.prueba?.vieja ? `<div class="pers-vieja">${T("pers.prueba_vieja")}</div>` : ""}
        ${t?.estado === "error" ? `<div class="error-box" style="margin:6px 0 0">${esc(t.error)}</div>` : ""}
      </div>
      <div class="fila">
        ${simple ? "" : `<button class="btn chico" data-p="probar" ${activo ? "disabled" : ""}>${T("pers.probar")}</button>`}
        <button class="btn chico" data-p="editar" ${activo ? "disabled" : ""}>${T("pers.editar")}</button>
        <button class="btn chico fantasma" data-p="copiar" title="${esc(T("pers.copiar", { nombre: p.nombre }))}">@</button>
        <button class="btn chico fantasma" data-p="borrar" style="margin-left:auto" ${activo ? "disabled" : ""}>${T("pers.borrar")}</button>
      </div></div>`;
  }).join("") : `<div class="vacio-guion">${T("pers.vacio")}</div>`;
}

function renderFormPersonaje() {
  const ed = PERS.editando;
  $("#persFormTitulo").textContent = ed ? T("pers.editar_t", { nombre: ed }) : T("pers.nuevo");
  $("#pNombre").disabled = !!ed;
  $("#pGuardar").textContent = T(ed ? "pers.guardar" : "pers.crear");
  $("#pCancelar").hidden = !ed;
  const f = $("#pFuerza");
  f.min = PERS.fuerza.min; f.max = PERS.fuerza.max;
  $("#pFuerzaTxt").textContent = (+f.value).toFixed(2);
  const simple = $("#pModalidad").value === "foto";
  $("#pArchivos").multiple = !simple;
  $("#pModalidadNota").textContent = T(simple ? "pers.foto_nota" : "pers.completo_nota");
  renderFotosForm();
}

function maxFotosPersonaje() { return $("#pModalidad").value === "foto" ? 1 : PERS.maxFotos; }

function renderFotosForm() {
  const total = PERS.conservar.length + PERS.nuevas.length;
  const urls = PERS.nuevas.map(f => (f._url ??= URL.createObjectURL(f)));
  $("#pFotos").innerHTML = [
    ...PERS.conservar.map((f, i) => `<div class="pers-foto"><img src="${esc(f.url)}" alt=""><button data-quitar="c${i}" title="${T("pers.quitar_foto")}">✕</button></div>`),
    ...urls.map((u, i) => `<div class="pers-foto"><img src="${u}" alt=""><button data-quitar="n${i}" title="${T("pers.quitar_foto")}">✕</button></div>`),
    total < maxFotosPersonaje() ? `<div class="pers-foto anadir" data-anadir title="${T("pers.anadir_foto")}">＋</div>` : "",
  ].join("");
}

function limpiarFormPersonaje() {
  PERS.editando = null; PERS.conservar = []; PERS.nuevas = [];
  $("#pModalidad").value = "foto";
  $("#pNombre").value = ""; $("#pDesc").value = "";
  $("#pFuerza").value = PERS.fuerza.defecto;
  renderFormPersonaje();
  if (PERS.lista) renderPersonajes();
}

function editarPersonaje(nombre) {
  const p = PERS.lista.find(x => x.nombre === nombre);
  if (!p) return;
  $("#pModalidad").value = p.modalidad || "completo";
  PERS.editando = nombre; PERS.conservar = p.fotos.map(f => ({ ...f })); PERS.nuevas = [];
  $("#pNombre").value = p.nombre; $("#pDesc").value = p.descripcion; $("#pFuerza").value = p.fuerza;
  renderFormPersonaje(); renderPersonajes();
  $("#persForm").scrollIntoView({ block: "nearest", behavior: "smooth" });
}

async function guardarPersonaje() {
  const nombre = $("#pNombre").value.trim().toLowerCase(), ed = PERS.editando;
  if (!ed && !/^[a-z0-9][a-z0-9_-]{0,31}$/.test(nombre)) { toast(T("pers.falta_nombre"), "error"); $("#pNombre").focus(); return; }
  if (!PERS.conservar.length && !PERS.nuevas.length) { toast(T("pers.falta_foto"), "error"); return; }
  if ($("#pModalidad").value === "foto" && PERS.conservar.length + PERS.nuevas.length !== 1) {
    toast(T("pers.una_foto_error"), "error"); return;
  }
  const fd = new FormData();
  fd.append("modalidad", $("#pModalidad").value);
  if (!ed) fd.append("nombre", nombre);
  fd.append("descripcion", $("#pDesc").value.trim());
  fd.append("fuerza", $("#pFuerza").value);
  if (ed) fd.append("conservar", JSON.stringify(PERS.conservar.map(f => f.nombre)));
  PERS.nuevas.forEach(f => fd.append("fotos", f));
  const b = $("#pGuardar");
  b.disabled = true;
  try {
    const r = await fetch(ed ? `/api/personajes/${encodeURIComponent(ed)}` : "/api/personajes",
      { method: ed ? "PUT" : "POST", body: fd, headers: cabeceras() });
    const data = await r.json().catch(() => null);
    if (!r.ok) throw new Error(errorHttp(data, r.status));
    toast(ed ? T("pers.guardado") : T("pers.creado", { nombre: data.nombre }), "ok");
    limpiarFormPersonaje();
    await cargarPersonajes();
  } catch (e) { toast(e.message, "error"); }
  finally { b.disabled = false; }
}

async function accionPersonaje(accion, nombre) {
  try {
    if (accion === "probar") { pedirPermisoAvisos(); await api("POST", `/api/personajes/${encodeURIComponent(nombre)}/probar`); await cargarPersonajes(); programarPoll(0); }
    if (accion === "editar") editarPersonaje(nombre);
    if (accion === "copiar") {
      await navigator.clipboard?.writeText(`@${nombre}`).catch(() => {});
      toast(T("pers.copiado", { nombre }), "ok");
    }
    if (accion === "borrar") {
      if (!await confirmarAccion(T("pers.confirmar_borrar", { nombre }), T("pers.borrar"))) return;
      await api("DELETE", `/api/personajes/${encodeURIComponent(nombre)}`);
      if (PERS.editando === nombre) limpiarFormPersonaje();
      toast(T("pers.borrado", { nombre }));
      await cargarPersonajes();
    }
  } catch (e) { toast(e.message, "error"); }
}

function peso(b) {
  return b >= 1e9 ? `${(b / 1e9).toFixed(1)} GB` : b >= 1e6 ? `${(b / 1e6).toFixed(0)} MB` : `${Math.round(b / 1e3)} KB`;
}
async function renderEspacio(datos) {
  try {
    const e = datos || (await api("GET", "/api/espacio")).data;
    $("#espacio").innerHTML = `
      <div class="dato"><span>salida/</span><span>${peso(e.salida)}</span></div>
      <div class="dato"><span>papelera/</span><span>${peso(e.papelera)}</span></div>
      <div class="dato"><span title="${esc(e.ruta_modelos)}">${T("esp.modelos")}</span><span>${peso(e.modelos)}</span></div>
      <div class="dato"><span>${T("esp.liberable")}</span><span><b>${peso(e.liberable)}</b></span></div>`;
    const b = $("#bLimpiar");
    b.disabled = e.liberable < 1e5;
    b.textContent = e.liberable < 1e5 ? T("esp.nada") : T("esp.limpiar_n", { peso: peso(e.liberable) });
    return e;
  } catch (err) { $("#espacio").textContent = err.message; }
}
async function limpiarDisco() {
  const e = await renderEspacio();
  if (!e || !await confirmarAccion(T("esp.confirmar", { peso: peso(e.liberable) }), T("dlg.limpiar"))) return;
  try {
    const { data } = await api("POST", "/api/espacio/limpiar");
    renderEspacio(data);
    if (data.errores.length) toast(T("esp.liberados_err", { peso: peso(data.liberado), errores: data.errores.join(" · ") }), "error");
    else toast(T("esp.liberados", { peso: peso(data.liberado) }), "ok");
  } catch (err) { toast(err.message, "error"); }
}

/** Sección "Proveedor de IA" de Ajustes. Las claves nunca llegan completas: solo "…abcd". */

/** Ajustes > motor de voz: la lista de voces en español es la del motor elegido. */

  const a = S.ajustes, motor = $("#aMotor").value;

async function guardarAjustes() {
  const motor = $("#aMotor").value;
  const nuevos = {
    motor_voz: motor, [motor === "kokoro" ? "voz_kokoro" : "voz"]: $("#aVoz").value, formato: $("#aFormato").value, estilo_visual: $("#aEstilo").value.trim(),
    frase_cierre: { es: $("#aCierreEs").value.trim(), en: $("#aCierreEn").value.trim() },
    rate: $("#aRate").value.trim(), calidad: $("#aCalidad").value,
    subtitulos: $("#aSubs").checked, marca_agua: $("#aMarca").checked, demo: $("#aDemo").checked,
    portada: $("#aPortada").checked,
    cierre_tarjeta: $("#aCierreTarjeta").checked, cierre_nombre: $("#aCierreNombre").value.trim(),
    estilo_subtitulos: SUBS ? leerSubs($("#aSubs2 .subs-ctl")) : S.ajustes.estilo_subtitulos,
    estilo_marca: SUBS ? leerMarca($("#aMarcaCtl .marca-ctl")) : S.ajustes.estilo_marca,
    proveedor_ia: $("#aIA").value,
    anthropic_modelo: $("#aAnthModelo").value.trim(), openai_modelo: $("#aOpenaiModelo").value.trim(),
    gemini_modelo: $("#aGeminiModelo").value.trim(), ollama_modelo: $("#aOllamaModelo").value.trim(),
    buscar_google: $("#aGoogle").checked,
  };
  // una clave solo viaja si la escribiste (o vacía si pediste quitarla); si no, se queda la guardada
  for (const [p, id] of [["anthropic", "#aAnthKey"], ["openai", "#aOpenaiKey"], ["gemini", "#aGeminiKey"]]) {
    const v = $(id).value.trim();
    if (v) nuevos[`${p}_api_key`] = v; else if (IA_QUITAR[p]) nuevos[`${p}_api_key`] = "";
  }
  try {
    S.ajustes = (await api("PUT", "/api/ajustes", nuevos)).data;
    $("#aAnthKey").value = $("#aOpenaiKey").value = $("#aGeminiKey").value = "";
    for (const k in IA_QUITAR) delete IA_QUITAR[k];
    renderIA();
    botonesEscritura();
    toast(T("aj.guardados"), "ok");
  } catch (e) { toast(e.message, "error"); }
}

// ---------------- avisos al terminar ----------------
let VISTOS = null;  // ids de trabajos ya avisados; los que ya habían acabado al abrir la app no se avisan
function avisarTerminados(lista) {
  if (!VISTOS) { VISTOS = new Set(lista.map(t => t.id)); return; }
  for (const t of lista) {
    if (VISTOS.has(t.id)) continue;
    VISTOS.add(t.id);
    const ok = t.estado === "listo", nombre = t.tipo === "personaje" ? `@${t.titulo}` : `«${t.titulo}»`;
    const msg = T(`fin.${t.tipo}_${ok ? "ok" : "error"}`, { nombre });
    const ver = t.tipo === "personaje" ? () => ir("personajes") : () => ir("nuevo", t.slug);
    toast(msg, ok ? "ok" : "error", { texto: T("fin.ver"), fn: ver, ms: 20000 });
    if (document.hidden && "Notification" in window && Notification.permission === "granted")
      new Notification("CompressOS Studio", { body: msg, icon: "/logo/compresso.png" });
  }
}
/** Al lanzar algo largo, pedir permiso (una vez) para avisar también si la ventana está en segundo plano. */
function pedirPermisoAvisos() {
  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission().catch(() => {});
}

// ---------------- sondeo ----------------
function programarPoll(ms) { clearTimeout(S.tPoll); if (!S.cerrada) S.tPoll = setTimeout(poll, ms); }

async function poll() {
  const { tab } = ruta();
  let activo = false;
  try {
    if (tab === "nuevo" && S.slug) {
      const { data } = await api("GET", `/api/guiones/${encodeURIComponent(S.slug)}`);
      const editando = S.sucio || document.activeElement?.closest?.("#tab-nuevo .panel.guion, #tab-nuevo .panel.idea");
      if (data.mtime !== S.mtime && !editando && data.slug === S.slug) {
        // cambió el archivo por fuera (Claude Code escribió el guion, o un editor)
        const antes = S.doc.escenas.length;
        cargarDetalle(data, true);
        toast(T(antes ? "guion.actualizado" : "guion.llego"), "ok");
      } else if (data.slug === S.slug) {
        S.det = { ...data, doc: S.det.doc };
        actualizarEstados();
      }
      activo = trabajosActivos().length > 0;
    } else if (tab === "biblioteca") {
      await cargarBiblioteca();
      activo = BIB.some(t => t.estado === "generando");
    } else if (tab === "estudio") {
      await cargarEstudio();
      activo = ESTUDIO.imagenes.some(i => ["en cola", "corriendo"].includes(i.estado));
    } else if (tab === "personajes") {
      const antes = JSON.stringify((PERS.lista || []).map(p => [p.trabajo?.estado, p.prueba?.url]));
      await cargarPersonajes();
      activo = (PERS.lista || []).some(p => p.trabajo && (p.trabajo.estado === "en cola" || p.trabajo.estado === "corriendo"));
      if (antes === JSON.stringify((PERS.lista || []).map(p => [p.trabajo?.estado, p.prueba?.url]))) { /* sin cambios */ }
    }
    const s = (await api("GET", "/api/sistema")).data;
    avisarTerminados(s.terminados || []);
    const cambio = !!S.descarga !== !!s.descarga || S.descarga?.gb !== s.descarga?.gb;
    S.descarga = s.descarga;
    if (cambio && S.slug) actualizarEstados();
    const cg = $("#colaGlobal");
    cg.hidden = !s.cola.length;
    cg.innerHTML = s.cola.length ? `<span class="giro"></span><span class="txt">${s.descarga
      ? T("cola.descargando", { gb: s.descarga.gb.toFixed(1), total: s.descarga.total }) : T("cola.n", { n: s.cola.length })}</span>` : "";
    activo ||= s.cola.length > 0;
  } catch (e) {
    // el guion abierto ya no existe (se movió a la papelera desde otra pestaña o a mano): se suelta
    if (e?.status === 404 && tab === "nuevo" && S.slug) { toast(e.message, "error"); nuevo(); ir("nuevo"); }
    /* si no: servidor caído o reiniciando, se reintenta */
  }
  programarPoll(activo ? 1000 : 4000);
}

  g.addEventListener("input", e => {
    const inicio = e.target.closest('input[data-inicio-clip]');
    if (inicio) {
      const i = +inicio.closest('.escena').dataset.i, valor = Math.round(inicio.valueAsNumber * 1000) / 1000;
      const dur = S.det.escenas[i]?.media?.duracion;
      if (!Number.isFinite(valor) || valor < 0 || (Number.isFinite(dur) && valor >= dur)) {
        inicio.setCustomValidity(T('clip.inicio_invalido')); return;
      }
      inicio.setCustomValidity('');
      S.doc.escenas[i].inicio_clip = Math.round(valor * 1000) / 1000;
      guardarLuego(); return;
    }
    const pz = e.target.closest("input[data-pausa]");
    if (pz) {
      const i = +pz.closest(".escena").dataset.i, v = Math.min(10, Math.max(0, Math.round((+pz.value || 0) * 10) / 10));
      if (v) S.doc.escenas[i].pausa = v; else delete S.doc.escenas[i].pausa;
      guardarLuego();
      return;
    }
    const ta = e.target.closest("textarea[data-campo]"); if (!ta) return;
    const i = +ta.closest(".escena").dataset.i;
    S.doc.escenas[i][ta.dataset.campo] = ta.value;
    if (ta.dataset.campo === "prompt" && S.doc.escenas[i].prompt_sugerido) {  // ya lo editaste: deja de ser sugerido
      delete S.doc.escenas[i].prompt_sugerido;
      $("[data-sugerido]", ta.closest(".escena")).hidden = true;
    }
    autoAlto(ta);
    guardarLuego();
    actualizarEstados();
  });
  g.addEventListener("focusout", e => {
    const inicio = e.target.closest('input[data-inicio-clip]');
    if (inicio && !inicio.checkValidity()) {
      const i = +inicio.closest('.escena').dataset.i;
      inicio.value = S.doc.escenas[i]?.inicio_clip || 0;
      inicio.setCustomValidity(''); toast(T('clip.inicio_invalido'), 'error'); return;
    }
    const ta = e.target.closest("textarea[data-campo]"); if (!ta) return;
    const i = +ta.closest(".escena").dataset.i, campo = ta.dataset.campo;
    if (S.foco.i !== i || S.foco.campo !== campo || S.foco.valor.trim() === ta.value.trim() || !ta.value.trim()) { guardar(); return; }
    if (campo === "prompt" && S.doc.escenas[i].media) { guardar(); return; }  // usa su archivo propio
    // texto editado -> solo esa voz; prompt editado -> solo esa imagen (el pipeline cachea por hash)
    if (campo === "prompt") S.doc.escenas[i].semilla = 0;
    S.sucio = true;
    generar(campo === "texto" ? "voz" : "imagen", i + 1);
  });
  g.addEventListener("click", e => {
    const img = e.target.closest(".mini img");
    if (img?.dataset.clip) {
      const i = +img.closest('.escena').dataset.i;
      return verClip(img.dataset.clip, S.doc.escenas[i]?.inicio_clip || 0);
    }
    if (img) return verImagen(img.src);
    const b = e.target.closest("[data-accion]"); if (!b) return;
    const card = b.closest(".escena");
    accionEscena(b.dataset.accion, card ? +card.dataset.i : +b.dataset.i);
  });

  // miniatura
  $("#vistaCuerpo").addEventListener("input", e => {
    if (e.target.id !== "fTituloMini") return;
    S.doc.titulo_miniatura = e.target.value;
    guardarLuego();
    renderMiniatura(false);
  });
  $("#vistaCuerpo").addEventListener("change", e => {
    if (e.target.id !== "fMiniEscena") return;
    S.doc.miniatura_escena = +e.target.value;
    S.sucio = true;
    generar("miniatura");  // cambiar la imagen base regenera al momento (es rápido)
  });

  // vista previa
  $("#vistaCuerpo").addEventListener("click", async e => {
    if (e.target.closest("#bMiniatura")) generar("miniatura");
    const im = e.target.closest("#miniPrev img");
    if (im) verImagen(im.src);
    if (e.target.closest("#bGenerar")) { pedirPermisoAvisos(); generar("video"); }
    if (e.target.closest("#bOtroVideo")) otroVideo();
    if (e.target.closest("#bAbrir")) {
      try { await api("POST", `/api/guiones/${S.slug}/abrir`); toast(T("vista.carpeta_abierta")); }
      catch (err) { toast(err.message, "error"); }
    }
  });

  // biblioteca
  $("#bibFiltros").onclick = e => { const c = e.target.closest("[data-filtro]"); if (c) { S.filtro = c.dataset.filtro; renderBiblioteca(); } };
  $("#bibRejilla").onclick = e => {
    const menu = e.target.closest(".menu-tarjeta");
    if (menu) {
      const b = e.target.closest("[data-menu]");
      if (b) { menu.open = false; accionTarjeta(b.dataset.menu, menu.closest(".tarjeta").dataset.slug); }
      else $$(".menu-tarjeta[open]").forEach(m => m !== menu && (m.open = false));  // un menú abierto a la vez
      return;
    }
    const t = e.target.closest(".tarjeta"); if (!t) return;
    if (t.dataset.nuevo !== undefined) { nuevo(); ir("nuevo"); }
    else ir("nuevo", t.dataset.slug);
  };
  $("#bibRejilla").onkeydown = e => {
    if (e.key === "Enter" && e.target.matches(".tarjeta[data-slug]")) ir("nuevo", e.target.dataset.slug);
  };
  document.addEventListener("click", e => {
    if (!e.target.closest(".menu-tarjeta")) $$(".menu-tarjeta[open]").forEach(m => m.open = false);
    $$(".menu-img[open]").forEach(m => m !== e.target.closest(".menu-img") && (m.open = false));
  });

  // ajustes
  $("#bGuardarAjustes").onclick = guardarAjustes;
  $("#fTema").addEventListener("input", actualizarBusqueda);
  $("#estMejorar").onclick = async () => {
    const boton = $("#estMejorar"), campo = $("#estPrompt"), texto = campo.value;
    boton.disabled = true;
    try {
      const {data} = await api("POST", "/api/prompt/mejorar", {texto});
      if (campo.value === texto) {
        campo.value = data.prompt;
        campo.dispatchEvent(new Event("input"));
      }
    } catch (err) { toast(err.message, "error"); }
    finally { boton.disabled = false; }
  };
  $("#bSalirSesion").onclick = async () => { await api("POST", "/api/auth/salir"); location.replace("/entrar"); };
  $("#fProbarVoz").onclick = () => reproducirVoz($("#fVoz").value, S.ajustes.rate, $("#fAudioVoz"));
  $("#aProbarVoz").onclick = () => reproducirVoz($("#aVoz").value, $("#aRate").value, $("#aAudioVoz"));
  for (const id of ["aCierreNombre", "aCierreTarjeta", "aFormato"])
    $(`#${id}`).addEventListener("change", actualizarVistaCierre);
  $("#bMarcaGlobal").onclick = async () => {
    const d = datosIdea();
    if (!d.marca || typeof d.marca !== "object") return;
    try {
      S.ajustes = (await api("PUT", "/api/ajustes", {estilo_marca: d.marca, marca_agua: Boolean(S.ajustes.logo_marca)})).data;
      delete d.marca;
      renderMarcaGuion();
      if (S.slug) guardarLuego();
      toast(T("aj.guardados"), "ok");
    } catch (err) { toast(err.message, "error"); }
  };
  $$("[data-guardar-ajustes]").forEach(b => b.onclick = guardarAjustes);
  $("#aIA").onchange = renderIA;
  $("#aMotor").onchange = renderMotor;
  $$("[data-quitar-clave]").forEach(b => b.onclick = e => { e.preventDefault(); IA_QUITAR[b.dataset.quitarClave] = true; renderIA(); });
  $("#bLimpiar").onclick = limpiarDisco;
  $("#bLiberar").onclick = async () => { await api("POST", "/api/sistema/liberar"); toast(T("aj.liberando")); setTimeout(renderAjustes, 1500); };

  // configuración inicial
  $("#tab-setup").addEventListener("click", e => {
    const b = e.target.closest("[data-setup]");
    if (b && !b.disabled) accionSetup(b.dataset.setup);
  });
  $("#bAbrirSetup").onclick = () => ir("setup");
  $("#bApoyar").onclick = abrirApoyo;
  $("#bCerrarApp").onclick = $("#bCerrarAppAj").onclick = cerrarApp;

  // idioma de la interfaz
  $("#selIdioma").onchange = e => cambiarIdiomaUI(e.target.value);

  // ayuda: el índice abre la sección y baja hasta ella (sin tocar el hash: lo usa la navegación)
  $("#ayudaIndice").onclick = e => {
    const id = e.target.closest("[data-ir]")?.dataset.ir;
    if (!id) return;
    const d = $(`#ayuda-${id}`);
    d.open = true;
    d.scrollIntoView({ behavior: "smooth", block: "start" });
  };
  $("#ayudaSecciones").addEventListener("toggle", botonAyudaTodo, true);
  $("#ayudaSecciones").onclick = e => { const img = e.target.closest(".ayuda-paso img"); if (img) verImagen(img.src); };
  $("#bAyudaTodo").onclick = () => {
    const abrir = !$$("#ayudaSecciones details").every(d => d.open);
    $$("#ayudaSecciones details").forEach(d => { d.open = abrir; });
  };

  // personajes
  $("#pModalidad").onchange = renderFormPersonaje;
  $("#pFuerza").oninput = e => { $("#pFuerzaTxt").textContent = (+e.target.value).toFixed(2); };
  $("#pNombre").oninput = e => { const v = e.target.value.toLowerCase().replace(/\s+/g, ""); if (v !== e.target.value) e.target.value = v; };
  $("#pGuardar").onclick = guardarPersonaje;
  $("#pCancelar").onclick = limpiarFormPersonaje;
  $("#pFotos").onclick = e => {
    if (e.target.closest("[data-anadir]")) return $("#pArchivos").click();
    const q = e.target.closest("[data-quitar]")?.dataset.quitar;
    if (!q) return;
    if (q[0] === "c") PERS.conservar.splice(+q.slice(1), 1); else PERS.nuevas.splice(+q.slice(1), 1);
    renderFotosForm();
  };
  $("#pArchivos").onchange = e => {
    const libres = Math.max(0, maxFotosPersonaje() - PERS.conservar.length - PERS.nuevas.length), fs = [...e.target.files];
    if (fs.length > libres) toast(T("pers.max_fotos", { max: maxFotosPersonaje() }), "error");
    PERS.nuevas.push(...fs.slice(0, libres));
    e.target.value = "";
    renderFotosForm();
  };
  $("#persLista").onclick = e => {
    const img = e.target.closest(".pers-prueba img");
    if (img) return verImagen(img.src);
    const b = e.target.closest("[data-p]");
    if (b) accionPersonaje(b.dataset.p, b.closest(".tarjeta-pers").dataset.nombre);
  };

  window.addEventListener("beforeunload", e => { if (S.sucio) { guardar(); e.preventDefault(); } });
}

function verImagen(src) {
  const v = Object.assign(document.createElement("div"), { className: "visor", innerHTML: `<img src="${esc(src)}" alt="">` });
  v.onclick = () => v.remove();
  document.body.append(v);
}

function renderTodo() { renderIdea(); renderGuion(); renderVista(); }

// ---------------- cerrar la app ----------------
/** "Cerrar CompressOS Studio": con trabajos en marcha pide confirmación; luego el servidor suelta los modelos y
 *  se cierra (con el lanzador, también el icono de la bandeja y ffmpeg). Queda una pantalla final. */
async function cerrarApp() {
  if (S.cerrando || S.cerrada) return;
  S.cerrando = true;
  try {
    let r = await api("POST", "/api/cerrar", {});
    if (r.status === 409) {
      const n = r.data?.pendientes?.length || 0;
      if (!(await confirmarAccion(T("cerrar.confirmar", { n }), T("cerrar.si")))) return;
      r = await api("POST", "/api/cerrar", { forzar: true });
      if (r.status === 409) throw new Error(errorHttp(r.data, 409));
    }
    pantallaCerrada();
  } catch (err) {
    // el servidor pudo cerrarse antes de responder: si ya no contesta (fallo de red), está cerrado
    if (err instanceof TypeError) pantallaCerrada(); else toast(err.message, "error");
  } finally { S.cerrando = false; }
}

function pantallaCerrada() {
  S.cerrada = true;
  clearTimeout(S.tPoll);
  document.title = T("cerrar.titulo");
  document.body.innerHTML = `<div class="app-cerrada"><div>
    <h1>${esc(T("cerrar.titulo"))}</h1><p>${esc(T("cerrar.pestana"))}</p></div></div>`;
}

/** Pie de página con la versión (app/version.py, llega en /api/ajustes). */
function versionApp() {
  const v = $("#pie")?.dataset.version || "";
  return S.ajustes?.version || (v.startsWith("{{") ? "" : v);  // data-version: el servidor escribe la versión al servir la página
}
function renderPie() { if ($("#pie")) $("#pie").innerHTML = T("pie_html", { version: versionApp() }); }

// ---------------- idioma de la interfaz ----------------
function llenarSelectorIdioma() {
  const sel = $("#selIdioma");
  sel.innerHTML = IDIOMAS_UI.map(l => `<option value="${l}" title="${esc(I18N[l]._nombre)}">${esc(I18N[l]._corto)}</option>`).join("");
  sel.value = LANG;
}

/** Cambia el idioma de la interfaz sin recargar: textos fijos, columnas, Biblioteca y Ajustes. Los mensajes
 *  del servidor llegan en el idioma nuevo desde la siguiente petición (cabecera X-Idioma). */
function cambiarIdiomaUI(l) {
  const { tab } = ruta();
  // Conservar solo el borrador visual; Guardar ajustes sigue siendo quien lo persiste.
  const marcaPendiente = tab === "ajustes" && S.ajustes && SUBS && $("#aMarcaCtl .marca-ctl")
    ? { activa: $("#aMarca").checked, estilo: leerMarca($("#aMarcaCtl .marca-ctl")) } : null;
  guardarIdioma(l);
  aplicarI18n();
  renderPie();
  $("#subsGuionCtl").innerHTML = "";  // los controles de subtítulos se construyen una vez: se rehacen
  $("#aSubs2").innerHTML = "";
  $("#marcaGuionCtl").innerHTML = $("#aMarcaCtl").innerHTML = "";
  $("#guionCuerpo").innerHTML = "";   // también el "Escribiendo…"
  if (S.traduccion) $("#bTraducir").innerHTML = `<span class="giro"></span> ${T("tr.traduciendo")}`;
  if (S.ajustes) renderTodo();
  if (tab === "biblioteca") cargarBiblioteca();
  if (tab === "personajes") { renderFormPersonaje(); if (PERS.lista) renderPersonajes(); }
  if (tab === "estudio") { renderEstudio(); cargarEstudio(true); }
  if (tab === "ajustes" && S.ajustes) renderAjustes(marcaPendiente);
  if ($("#ayudaSecciones").children.length) renderAyuda();
  if (tab === "setup") renderSetup();
  if (S.ajustes) botonesEscritura();
  if (S.slug && !S.escritura) $("#estadoGuardado").textContent = "";
  programarPoll(0);
}

/** Recuperación explícita: solo se envía la nueva clave del proveedor afectado. */
async function recuperarDPAPI() {
  const { data } = await api("GET", "/api/credenciales/estado");
  if (!data.afectadas.length) return false;
  const en = LANG === "en";
  for (const proveedor of data.afectadas) {
    if (!["anthropic", "openai", "gemini"].includes(proveedor)) return false;
    const dlg = document.createElement("dialog");
    dlg.innerHTML = `<form method="dialog">
      <h3>${en ? "Replace unreadable API key" : "Reemplazar API key ilegible"}: ${proveedor}</h3>
      <p>${en ? "The server could not decrypt this key. Its original value cannot be displayed. Enter a replacement; other keys and settings will be preserved." : "El servidor no pudo descifrar esta clave. No es posible mostrar su valor original. Introduce una nueva; las demás claves y ajustes se conservarán."}</p>
      <input type="password" autocomplete="off" required aria-label="${en ? "New API key" : "Nueva API key"}">
      <p role="alert"></p>
      <button type="button" data-cancel>${en ? "Cancel" : "Cancelar"}</button>
      <button type="submit">${en ? "Protect and replace this key" : "Proteger y reemplazar esta clave"}</button>
    </form>`;
    document.body.append(dlg);
    const ok = await new Promise(resolve => {
      dlg.oncancel = e => { e.preventDefault(); dlg.close(); resolve(false); };
      dlg.querySelector("[data-cancel]").onclick = () => { dlg.close(); resolve(false); };
      dlg.querySelector("form").onsubmit = async e => {
        e.preventDefault();
        const input = dlg.querySelector("input"), b = dlg.querySelector('[type="submit"]');
        b.disabled = true;
        try {
          await api("POST", "/api/credenciales/reemplazar", { proveedor, nueva_clave: input.value });
          input.value = "";
          dlg.close(); resolve(true);
        } catch (error) {
          dlg.querySelector('[role="alert"]').textContent = error.message;
        } finally { b.disabled = false; }
      };
      dlg.showModal();
    });
    dlg.querySelector("input").value = "";
    dlg.remove();
    if (!ok) return false;
  }
  return true;
}

(async function arrancar() {
  aplicarI18n();
  llenarSelectorIdioma();
  renderPie();
  try {
    const [a, m, sb] = await Promise.all([api("GET", "/api/ajustes"), api("GET", "/api/musica"), api("GET", "/api/subtitulos")]);
    S.ajustes = a.data; S.musica = m.data; SUBS = sb.data;
    $("#bSalirSesion").hidden = !a.data.auth;
    $("#estadoMotor").hidden = !a.data.linux;
    if (a.data.linux) {
      for (const id of ["aCalidad", "estCalidad"]) {
        $(`#${id}`).replaceChildren(...[
          ["rapida", "SD Turbo GGUF"], ["sd_turbo", "SD Turbo"], ["sdxl_turbo", "SDXL Turbo"], ["alta", "SDXL Base 1.0"],
        ].map(([valor, nombre]) => new Option(nombre, valor)));
      }
    }
    renderPie();
    cargarFuentesCss();
  } catch (e) {
    try {
      if (await recuperarDPAPI()) { location.reload(); return; }
    } catch { /* conservar el error inicial, sin valores de credenciales */ }
    toast(e.message, "error"); return;
  }
  conectar();
  $("#pFuerza").value = PERS.fuerza.defecto;
  cargarPersonajes().then(() => { if (S.slug) actualizarEstados(); });  // para los avisos de @nombre en el guion
  nuevo();
  // app instalada, primera vez: la configuración inicial (versión gratuita: sin clave)
  if (S.ajustes.instalado && ruta().tab !== "setup") {
    try {
      if (!(await api("GET", "/api/setup")).data.visto) location.hash = "#/setup";
    } catch { /* sin setup: la app sigue */ }
  }
  await alNavegar();
  // las voces vienen de internet: no bloquean el arranque
  api("GET", "/api/voces").then(r => { S.voces = r.data; renderIdea(); if (ruta().tab === "ajustes") renderMotor(); }).catch(() => {});
})();
</script>
