<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<title>CompressOS Studio</title>
<link rel="icon" type="image/png" sizes="256x256" href="/logo/compresso.png">
<link rel="apple-touch-icon" href="/logo/compresso.png">
<script src="/i18n.js"></script>
<script src="/estudio.js"></script>
<style>
:root {
  --bg: #0e1014; --panel: #161920; --panel-2: #1d2129; --borde: #2a2f3a; --borde-2: #363c4a;
  --texto: #e7e9ee; --texto-2: #a3a9b6; --texto-3: #6f7685;
  --acento: #e8a33d; --acento-2: #f2bb63; --acento-txt: #1a1206;
  --ok: #4cc38a; --info: #5aa9e6; --aviso: #e8c33d; --error: #ef6461;
  --radio: 12px; --radio-s: 8px;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--texto);
  font: 14px/1.45 system-ui, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--acento-2); }
[hidden] { display: none !important; }

/* ---------- cabecera ---------- */
header { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px;
  padding: 10px 20px; background: rgba(14,16,20,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--borde); }
.marca { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .2px; white-space: nowrap; }
.marca img { width: 26px; height: 26px; display: block; flex: none; }
nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav button { background: none; border: 0; padding: 8px 14px; border-radius: 999px; color: var(--texto-2); cursor: pointer; white-space: nowrap; }
nav button:hover { color: var(--texto); background: var(--panel); }
nav button.activa { color: var(--acento-txt); background: var(--acento); font-weight: 600; }
.cola-global { margin-left: auto; font-size: 12px; color: var(--texto-2); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.idioma-ui { margin-left: auto; display: flex; align-items: center; gap: 4px; color: var(--texto-2); font-size: 13px; flex: none; }
.cola-global:not([hidden]) ~ .idioma-ui { margin-left: 0; }
.btn-cerrar-app { flex: none; width: auto; display: inline-flex; align-items: center; justify-content: center; background: none; border: 1px solid var(--borde); border-radius: var(--radio-s); color: var(--texto-2); padding: 4px 9px; font-size: 14px; line-height: 1; cursor: pointer; }
.btn-cerrar-app:hover, .btn-cerrar-app:focus-visible { color: var(--error); border-color: var(--error); }
.app-cerrada { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; text-align: center; }
.app-cerrada img { width: 64px; height: 64px; margin-bottom: 14px; }
.app-cerrada h1 { font-size: 22px; margin: 0 0 8px; }
.app-cerrada p { color: var(--texto-2); margin: 0; }
.prompt-largo { margin: 4px 0 0; font-size: 12px; color: var(--aviso); }
.prompt-largo[hidden] { display: none; }
.idioma-ui select { width: auto; padding: 5px 26px 5px 8px; font-size: 12px; font-weight: 600; background-color: var(--panel); }
main { padding: 20px; max-width: 1680px; margin: 0 auto; }

/* ---------- piezas comunes ---------- */
.panel { background: var(--panel); border: 1px solid var(--borde); border-radius: var(--radio); padding: 16px; min-width: 0; }
.panel > h2 { margin: 0 0 14px; font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--texto-2); display: flex; align-items: center; gap: 8px; }
.panel > h2 .n { width: 20px; height: 20px; border-radius: 50%; background: var(--panel-2); border: 1px solid var(--borde-2); display: grid; place-items: center; font-size: 11px; color: var(--texto); }
label.campo { display: block; margin-bottom: 14px; }
label.campo > span, .etq-campo { display: block; font-size: 12px; color: var(--texto-2); margin-bottom: 6px; }
input[type=text], input[type=number], input[type=password], select, textarea {
  width: 100%; background: var(--panel-2); border: 1px solid var(--borde); border-radius: var(--radio-s);
  padding: 9px 11px; outline: none; transition: border-color .15s; }
input:focus, select:focus, textarea:focus { border-color: var(--acento); }
textarea { resize: vertical; min-height: 44px; }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--texto-2) 50%), linear-gradient(135deg, var(--texto-2) 50%, transparent 50%);
  background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 14px; border-radius: var(--radio-s);
  border: 1px solid var(--borde-2); background: var(--panel-2); cursor: pointer; white-space: nowrap; text-decoration: none; color: var(--texto); }
.btn:hover:not(:disabled) { border-color: var(--texto-3); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primario { background: var(--acento); border-color: var(--acento); color: var(--acento-txt); font-weight: 600; }
.btn.primario:hover:not(:disabled) { background: var(--acento-2); }
.btn.grande { width: 100%; padding: 12px; font-size: 15px; }
.btn.chico { padding: 5px 9px; font-size: 12px; }
.btn.fantasma { background: none; border-color: transparent; color: var(--texto-2); }
.btn.fantasma:hover:not(:disabled) { color: var(--texto); background: var(--panel-2); }
.fila { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.segmentado { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--panel-2); border: 1px solid var(--borde); border-radius: var(--radio-s); padding: 3px; }
.segmentado button { border: 0; background: none; padding: 7px; border-radius: 6px; cursor: pointer; color: var(--texto-2); }
.segmentado button.activa { background: var(--borde-2); color: var(--texto); font-weight: 600; }
.segmentado small { display: block; font-size: 11px; color: var(--texto-3); font-weight: 400; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.chip { border: 1px solid var(--borde-2); background: none; border-radius: 999px; padding: 4px 10px; font-size: 12px; color: var(--texto-2); cursor: pointer; }
.chip:hover { color: var(--texto); }
.chip.activa { border-color: var(--acento); color: var(--acento-2); }
.nota { font-size: 12px; color: var(--texto-3); }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .4px; white-space: nowrap; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.b-idea { color: var(--texto-2); background: #ffffff10; }
.b-guion { color: var(--info); background: #5aa9e61c; }
.b-generando { color: var(--aviso); background: #e8c33d1c; }
.b-listo { color: var(--ok); background: #4cc38a1c; }
.b-error { color: var(--error); background: #ef64611c; }
.b-generando::before { animation: latido 1s infinite; }
@keyframes latido { 50% { opacity: .25; } }
.giro { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: giro .8s linear infinite; display: inline-block; flex: none; }
@keyframes giro { to { transform: rotate(360deg); } }

/* ---------- Nuevo video: 3 columnas ---------- */
.estudio { display: grid; grid-template-columns: minmax(260px, 320px) minmax(0, 1fr) minmax(300px, 400px); gap: 16px; align-items: start; }
.estudio > .panel { position: sticky; top: 72px; max-height: calc(100vh - 92px); overflow-y: auto; }
.estudio > .panel.guion { position: static; max-height: none; overflow: visible; }
@media (max-width: 1180px) {
  .estudio { grid-template-columns: minmax(250px, 300px) minmax(0, 1fr); }
  .estudio > .panel.vista { grid-column: 1 / -1; position: static; max-height: none; }
}
@media (max-width: 760px) {
  main { padding: 12px; }
  header { padding: 8px 12px; gap: 10px; }
  .marca span { display: none; }
  .estudio { grid-template-columns: minmax(0, 1fr); }
  .estudio > .panel { position: static; max-height: none; padding: 12px; }
  .cola-global .txt { display: none; }
  .escena { padding: 8px; gap: 8px; }
  .escena.vertical { --mini-w: 64px; }
  .escena.horizontal { --mini-w: 104px; }
  .esc-acc { margin-left: 0; width: 100%; justify-content: space-between; }
  .esc-acc .btn { min-width: 34px; padding: 6px; }
}
.slug { font-family: var(--mono); font-size: 12px; color: var(--texto-3); word-break: break-all; }
.musica-sel { display: flex; gap: 6px; }
.musica-sel select { flex: 1; min-width: 0; }
.musica-sel .btn { padding: 8px 11px; }
#musicaInfo { font-size: 12px; color: var(--texto-2); margin-top: 6px; }
#musicaInfo .aviso { color: var(--aviso); background: #e8c33d14; border-radius: 6px; padding: 7px 9px; display: block; }
.musica-subir { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.musica-subir select { width: auto; flex: 1; padding: 5px 28px 5px 8px; font-size: 12px; }
#pruebaCaja { margin-top: 8px; font-size: 12px; color: var(--texto-2); }
#pruebaCaja video { width: 100%; max-height: 260px; background: #000; border-radius: var(--radio-s); margin-top: 6px; display: block; }
.volumen { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 12px; color: var(--texto-2); }
.volumen input { flex: 1; accent-color: var(--acento); }
.reescribir { display: grid; gap: 6px; margin-top: 8px; }
.motor-etq { color: var(--texto-3); font-weight: 400; text-transform: none; letter-spacing: 0; }
.aviso-voz { margin: 6px 0 0; color: var(--aviso); }
#bOtroVideo { margin-top: 12px; }
.idioma-voz { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px; }
dialog.modal { width: min(860px, calc(100vw - 24px)); max-height: calc(100vh - 24px); padding: 0; border: 1px solid var(--borde-2);
  border-radius: var(--radio); background: var(--panel); color: var(--texto); box-shadow: 0 20px 60px rgba(0,0,0,.6); }
dialog.modal::backdrop { background: rgba(0,0,0,.65); }
dialog.modal form { display: grid; gap: 12px; padding: 18px; }
dialog.modal h3 { margin: 0; font-size: 16px; }
dialog.modal textarea { font-family: var(--mono); font-size: 12px; min-height: 46vh; resize: vertical; }
dialog.modal .errores { margin: 0; padding: 10px 12px 10px 28px; border-radius: 6px; background: #ef646114; color: #ffb3b1; font-size: 13px; }
dialog.modal .errores li + li { margin-top: 3px; }
dialog.modal textarea.medio { min-height: 22vh; }
dialog.modal textarea[readonly] { color: var(--texto-2); background: var(--panel-2); }
dialog.modal .etq-campo { margin: 0; }
dialog.modal.confirmacion { width:min(480px, calc(100vw - 32px)); padding:24px; border-radius:16px; box-shadow:0 24px 80px #0009; }
.confirmacion-cab { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
.confirmacion-icono { display:grid; place-items:center; width:34px; height:34px; flex:none; border-radius:50%; background:#e8a33d1a; color:var(--acento-2); font-size:20px; font-weight:700; }
.confirmacion p { white-space:pre-wrap; overflow-wrap:anywhere; color:var(--texto-2); margin:0 0 24px; line-height:1.6; }
.confirmacion-botones { display:flex; justify-content:flex-end; flex-wrap:wrap; gap:8px; }
.confirmacion button:focus-visible { outline:2px solid var(--acento-2); outline-offset:3px; }
@media(prefers-reduced-motion:reduce) { .toast { animation:none; } }
.escribiendo { text-align: center; padding: 40px 16px; border: 1px dashed var(--borde-2); border-radius: var(--radio); }
.escribiendo .giro { width: 28px; height: 28px; border-width: 3px; color: var(--acento); }
.escribiendo h4 { margin: 14px 0 4px; font-size: 16px; }
.escribiendo .reloj { font-family: var(--mono); font-size: 13px; color: var(--texto-2); }
.escribiendo ul { list-style: none; padding: 0; margin: 14px auto; max-width: 520px; font-size: 12px; color: var(--texto-2); text-align: left; }

/* columna guion */
.guion-cab { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.guion-cab h3 { margin: 0 0 4px; font-size: 18px; line-height: 1.25; }
.metricas { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--texto-2); }
.metricas b { color: var(--texto); font-weight: 600; }
.metricas .mal b { color: var(--error); }
.estado-guardado { font-size: 12px; color: var(--texto-3); white-space: nowrap; }
.avisos { margin: 0 0 12px; padding: 0; list-style: none; display: grid; gap: 6px; }
.avisos li { font-size: 12px; padding: 7px 10px; border-radius: 6px; background: #e8c33d14; color: var(--aviso); }
.avisos li.error { background: #ef646114; color: var(--error); }
.escenas { display: grid; gap: 10px; }
.escena { display: grid; grid-template-columns: var(--mini-w, 96px) minmax(0, 1fr); gap: 12px; padding: 10px; background: var(--panel-2); border: 1px solid var(--borde); border-radius: var(--radio); transition: border-color .15s; }
.escena:focus-within { border-color: var(--borde-2); }
.escena.vertical { --mini-w: 96px; }
.escena.horizontal { --mini-w: 150px; }
.mini { position: relative; border-radius: var(--radio-s); overflow: hidden; background: #0a0c10; border: 1px solid var(--borde); align-self: start; }
.vertical .mini { aspect-ratio: 9 / 16; }
.horizontal .mini { aspect-ratio: 16 / 9; }
.mini img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
.clip-opciones { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding:10px; border:1px solid var(--borde); border-radius:var(--radio-s); }
.clip-opciones label { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--texto-2); }
.clip-opciones input { width:85px; }
.clip-opciones .nota { flex-basis:100%; margin:0; }
.clip-preview { padding:16px; width:min(840px,calc(100vw - 24px)); }
.clip-preview .fila { justify-content:space-between; margin-bottom:12px; }
.clip-preview video { display:block; width:100%; max-height:70vh; background:#000; }
.mini .vacio { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-size: 11px; color: var(--texto-3); padding: 6px; }
.mini .vacio.falta { place-content: center; gap: 8px; color: var(--error, #e5484d); word-break: break-all; padding-bottom: 22px; }
.mini .vacio.falta .btn { font-size: 12px; padding: 6px 10px; white-space: nowrap; }
.mini .capa { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 6px; background: rgba(10,12,16,.72); color: var(--acento-2); font-size: 11px; }
.esc-cuerpo { min-width: 0; display: grid; gap: 6px; }
.esc-cab { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.esc-num { font-weight: 700; font-size: 13px; width: 24px; height: 24px; border-radius: 6px; background: var(--borde); display: grid; place-items: center; flex: none; }
.esc-meta { font-size: 12px; color: var(--texto-3); display: flex; gap: 10px; align-items: center; }
.esc-meta .largo { color: var(--error); font-weight: 600; }
.esc-meta .voz-pend { color: var(--aviso); }
.esc-acc { margin-left: auto; display: flex; flex-wrap: wrap; max-width: 100%; min-width: 0; gap: 2px; }
.esc-acc .btn { padding: 4px 7px; font-size: 13px; min-width: 30px; }
.esc-acc .btn.peligro:hover { color: var(--error); }
.escena textarea { background: var(--panel); min-height: 0; }
.escena textarea.texto { font-size: 15px; line-height: 1.45; }
.escena textarea.prompt { font-family: var(--mono); font-size: 12px; color: var(--texto-2); }
.etq { font-size: 11px; color: var(--texto-3); text-transform: uppercase; letter-spacing: .6px; }
.pers-n { display: block; margin-top: 4px; font-size: 18px; }
.etq-fila { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sugerido { font-size: 11px; color: var(--aviso); background: #e8c33d14; border-radius: 4px; padding: 1px 6px; }
#sinIA { margin: 6px 0 0; color: var(--aviso); }
.clave-estado { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; color: var(--texto-2); }
.anadir { width: 100%; margin-top: 10px; border-style: dashed; color: var(--texto-2); }
.vacio-guion { text-align: center; padding: 36px 16px; color: var(--texto-2); border: 1px dashed var(--borde-2); border-radius: var(--radio); }
.vacio-guion h4 { margin: 0 0 6px; color: var(--texto); font-size: 15px; }

/* columna vista previa */
.reproductor { background: #000; border-radius: var(--radio-s); overflow: hidden; display: grid; place-items: center; margin: 0 auto 10px; border: 1px solid var(--borde); }
.reproductor.vertical { aspect-ratio: 9 / 16; max-height: 62vh; width: auto; }
.reproductor.horizontal { aspect-ratio: 16 / 9; width: 100%; }
.reproductor video { width: 100%; height: 100%; display: block; }
.reproductor .sin { color: var(--texto-3); font-size: 13px; text-align: center; padding: 20px; }
.video-info { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--texto-2); margin-bottom: 12px; flex-wrap: wrap; }
.barra { height: 8px; border-radius: 999px; background: var(--panel-2); overflow: hidden; border: 1px solid var(--borde); }
.barra i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--acento), var(--acento-2)); transition: width .4s; }
.progreso-txt { display: flex; justify-content: space-between; font-size: 12px; color: var(--texto-2); margin: 6px 0 12px; }
.pasos { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 2px; max-height: 300px; overflow-y: auto; }
.pasos li { display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 8px; font-size: 13px; padding: 4px 6px; border-radius: 6px; color: var(--texto-2); }
.pasos li.corriendo { background: #e8a33d14; color: var(--texto); }
.pasos li.ok, .pasos li.cache { color: var(--texto); }
.pasos .ic { width: 16px; height: 16px; display: grid; place-items: center; font-size: 12px; }
.pasos .ok .ic { color: var(--ok); }
.pasos .cache .ic { color: var(--info); }
.pasos .error .ic { color: var(--error); }
.pasos .corriendo .ic { color: var(--acento); }
.pasos .seg { font-size: 11px; color: var(--texto-3); font-family: var(--mono); }
details.log summary { cursor: pointer; font-size: 12px; color: var(--texto-2); margin-bottom: 6px; }
details.log pre { margin: 0; max-height: 240px; overflow: auto; background: #08090c; border: 1px solid var(--borde); border-radius: var(--radio-s); padding: 10px; font: 11px/1.5 var(--mono); color: #b9c0cc; white-space: pre-wrap; word-break: break-word; }
.sub { margin: 20px 0 10px; padding-top: 16px; border-top: 1px solid var(--borde); font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--texto-2); }
.mini-prev { position: relative; background: #0a0c10; border: 1px solid var(--borde); border-radius: var(--radio-s); overflow: hidden; margin: 0 auto 10px; display: grid; place-items: center; }
.mini-prev.vertical { aspect-ratio: 9 / 16; max-height: 360px; }
.mini-prev.horizontal { aspect-ratio: 16 / 9; width: 100%; }
.mini-prev img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
.mini-prev .sin { color: var(--texto-3); font-size: 12px; text-align: center; padding: 12px; }
.mini-prev .capa { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 6px; background: rgba(10,12,16,.72); color: var(--acento-2); font-size: 12px; }
.contador { float: right; font-size: 11px; color: var(--texto-3); }
.contador.mal { color: var(--error); font-weight: 600; }
.error-box { font-size: 12px; color: var(--error); background: #ef646114; border-radius: 6px; padding: 8px 10px; margin-bottom: 10px; white-space: pre-wrap; }

/* ---------- biblioteca ---------- */
.bib-cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.bib-cab h1 { margin: 0; font-size: 22px; }
.rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.tarjeta { background: var(--panel); border: 1px solid var(--borde); border-radius: var(--radio); overflow: hidden; cursor: pointer; transition: transform .15s, border-color .15s; display: flex; flex-direction: column; text-align: left; padding: 0; }
.tarjeta:hover { border-color: var(--borde-2); transform: translateY(-2px); }
.tarjeta .portada { aspect-ratio: 16 / 10; background: #0a0c10 center / cover no-repeat; position: relative; display: grid; place-items: center; color: var(--texto-3); font-size: 12px; }
.tarjeta .portada .badge { position: absolute; top: 8px; left: 8px; backdrop-filter: blur(6px); background: rgba(10,12,16,.75); }
.tarjeta .portada .fmt { position: absolute; top: 8px; right: 8px; font-size: 11px; padding: 2px 7px; border-radius: 5px; background: rgba(10,12,16,.75); color: var(--texto-2); }
.tarjeta .cuerpo { padding: 12px; display: grid; gap: 6px; flex: 1; }
.tarjeta h3 { margin: 0; font-size: 14px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tarjeta .meta { font-size: 12px; color: var(--texto-3); display: flex; gap: 10px; flex-wrap: wrap; margin-top: auto; }

.menu-tarjeta summary:hover, .menu-tarjeta[open] summary { color: var(--texto); background: var(--panel-2); }
.menu-tarjeta > div, .menu-img > div { position: absolute; right: 0; bottom: calc(100% + 4px); z-index: 5; min-width: 130px; display: grid; padding: 4px;
  background: var(--panel-2); border: 1px solid var(--borde-2); border-radius: var(--radio-s); box-shadow: 0 8px 24px rgba(0,0,0,.45); }
.menu-tarjeta > div button, .menu-img > div button { background: none; border: 0; text-align: left; padding: 7px 10px; border-radius: 5px; cursor: pointer; font-size: 13px; color: var(--texto); white-space: nowrap; }

.menu-img summary { list-style: none; }
.menu-img > div { bottom: auto; top: calc(100% + 4px); min-width: 170px; }
.menu-img > div small { display: block; color: var(--texto-3); font-size: 11px; }
.menu-img.deshab summary { opacity: .45; pointer-events: none; }
.mini .q { position: absolute; left: 5px; bottom: 5px; font-size: 9px; font-weight: 700; letter-spacing: .5px; padding: 1px 5px; border-radius: 4px;
  background: rgba(10,12,16,.8); color: var(--acento-2); pointer-events: none; }
.mini .q.otra { color: var(--texto-3); }
.mini .q.propia { color: var(--ok); }
.pausa-caja { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--texto-3); }
.pausa-caja input { width: 72px; padding: 4px 8px; background: var(--panel); font-size: 12px; }
.tarjeta.nueva { border-style: dashed; align-items: center; justify-content: center; min-height: 220px; color: var(--texto-2); font-size: 15px; gap: 8px; background: none; }

/* ---------- subtítulos ---------- */
.subs-ctl div.campo { margin-bottom: 14px; }
.subs-ctl .colores { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.subs-ctl .colores label { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--texto-2);
  background: var(--panel-2); border: 1px solid var(--borde); border-radius: var(--radio-s); padding: 6px 8px 6px 11px; }
.subs-ctl input[type=color] { width: 36px; height: 26px; border: 0; padding: 0; background: none; cursor: pointer; }
.subs-ctl input[type=range] { width: 100%; accent-color: var(--acento); }
.subs-ctl .campo > span b { color: var(--texto); font-weight: 600; }
.muestra { margin-top: 8px; padding: 12px; border-radius: var(--radio-s); background: linear-gradient(135deg, #2b3a35, #3b2f22);
  font-size: 24px; line-height: 1.15; text-align: center; paint-order: stroke fill; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.muestra .k { color: #f2b84b; }
.preview-subs { margin-top: 10px; }
.preview-subs img { display: block; max-width: 100%; max-height: 520px; margin: 0 auto; border-radius: var(--radio-s); border: 1px solid var(--borde); cursor: zoom-in; }
.preview-subs .nota { text-align: center; margin-top: 4px; }
details.subs-guion { margin-bottom: 14px; border: 1px solid var(--borde); border-radius: var(--radio-s); padding: 10px 12px; background: var(--panel-2); }

.panel.ancho { grid-column: span 2; }
@media (max-width: 760px) { .panel.ancho { grid-column: auto; } }
.subs-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
@media (max-width: 1000px) { .subs-cols { grid-template-columns: minmax(0, 1fr); } }

/* ---------- personajes ---------- */
.personajes { display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .personajes { grid-template-columns: minmax(0, 1fr); } }
.pers-intro { margin: -8px 0 16px; font-size: 13px; color: var(--texto-2); }
.pers-intro code { color: var(--acento-2); }
.pers-fotos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 6px; }
.pers-foto { position: relative; aspect-ratio: 1; border-radius: var(--radio-s); overflow: hidden; background: var(--panel-2); border: 1px solid var(--borde); }
.pers-foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pers-foto button { position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgba(10,12,16,.8); color: var(--texto); cursor: pointer; font-size: 12px; }
.pers-foto.anadir { display: grid; place-items: center; cursor: pointer; border-style: dashed; color: var(--texto-2); font-size: 26px; }
.pers-foto.anadir:hover { color: var(--acento); border-color: var(--acento); }
.lista-pers { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.tarjeta-pers { background: var(--panel); border: 1px solid var(--borde); border-radius: var(--radio); padding: 12px; display: grid; gap: 10px; }
.tarjeta-pers.editando { border-color: var(--acento); }
.pers-cab { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; align-items: center; }
.pers-cab img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 2px solid var(--borde-2); }
.pers-cab h3 { margin: 0; font-size: 15px; font-family: var(--mono); }
.pers-cab p { margin: 2px 0 0; font-size: 12px; color: var(--texto-2); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.pers-prueba { position: relative; border-radius: var(--radio-s); overflow: hidden; background: #0a0c10; border: 1px solid var(--borde); min-height: 90px; display: grid; place-items: center; }
.pers-prueba img { width: 100%; display: block; cursor: zoom-in; }
.pers-prueba .sin { font-size: 12px; color: var(--texto-3); text-align: center; padding: 14px; }
.pers-prueba .capa { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 6px; background: rgba(10,12,16,.75); color: var(--acento-2); font-size: 12px; text-align: center; padding: 8px; }
.pers-poses { display: grid; grid-template-columns: repeat(3, 1fr); font-size: 10px; color: var(--texto-3); text-align: center; text-transform: uppercase; letter-spacing: .5px; }
.pers-vieja { font-size: 11px; color: var(--aviso); }

/* ---------- ajustes ---------- */
.ajustes { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; max-width: 1100px; }
.interruptor { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--borde); }
.interruptor:first-of-type { border-top: 0; }
.interruptor small { display: block; color: var(--texto-3); font-size: 12px; }
.interruptor input { width: 40px; height: 22px; accent-color: var(--acento); flex: none; }
.dato { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--borde); font-size: 13px; }
.dato:first-of-type { border-top: 0; }
.dato span:first-child { color: var(--texto-2); }
.dato span:last-child { text-align: right; word-break: break-all; }
.vram { height: 6px; border-radius: 999px; background: var(--panel-2); overflow: hidden; margin-top: 4px; }
.vram i { display: block; height: 100%; background: var(--info); }

/* ---------- marca de agua ---------- */
#aMarcaCtl { padding: 4px 0 10px; }
.marca-ctl .esquinas { grid-auto-flow: row; grid-template-columns: 1fr 1fr; gap: 3px; }
.marca-ctl .esquinas button { font-size: 12px; }
.marca-ctl .segmentado button:disabled { cursor: not-allowed; opacity: .55; }
.marca-ctl > .nota { margin: -4px 0 0; }
.marca-ctl input[type=range] { width: 100%; accent-color: var(--acento); }

/* ---------- configuración inicial ---------- */
.setup { max-width: 880px; margin: 0 auto; }
.setup h1 { margin: 4px 0 6px; font-size: 24px; }
.setup > .nota { margin: 0 0 16px; }
.setup .panel { margin-bottom: 14px; }
.setup-dev { color: var(--info); }
.setup .dato .ok { color: var(--ok); }
.setup .dato .mal { color: var(--aviso); }
.setup .dato small { color: var(--texto-3); margin-left: 6px; }
.setup .caja-aviso { margin-top: 12px; padding: 10px 12px; border-radius: var(--radio-s); border: 1px solid #e8c33d66; background: #e8c33d14; color: var(--texto-2); }
.setup .caja-error { margin-top: 12px; padding: 10px 12px; border-radius: var(--radio-s); border: 1px solid #ef646166; background: #ef646114; color: var(--texto-2); }
.perfiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.perfil { text-align: left; padding: 12px 14px; border-radius: var(--radio-s); border: 1px solid var(--borde-2); background: var(--panel-2); cursor: pointer; color: var(--texto); }
.perfil b { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.perfil b span { color: var(--texto-3); font-weight: 500; }
.perfil small { display: block; margin-top: 6px; color: var(--texto-2); font-size: 12px; line-height: 1.45; }
.perfil.activa { border-color: var(--acento); box-shadow: 0 0 0 1px var(--acento) inset; }
.perfil:disabled { opacity: .4; cursor: not-allowed; }
.comp { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 9px 0; border-top: 1px solid var(--borde); font-size: 13px; }
.comp:first-child { border-top: 0; }
.comp .estado { color: var(--texto-3); font-size: 12px; text-align: right; white-space: nowrap; }
.comp .estado.listo { color: var(--ok); }
.comp .estado.error { color: var(--error); }
.comp .barra { grid-column: 1 / -1; height: 6px; }
.setup-total { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin: 12px 0 8px; font-size: 13px; color: var(--texto-2); }
.setup-total b { color: var(--texto); }
.setup-acciones { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.setup-listo { font-size: 18px; font-weight: 700; color: var(--ok); margin: 4px 0 8px; }
.setup-pie { justify-content: flex-end; gap: 10px; margin: 6px 0 30px; }

/* ---------- ayuda ---------- */
.ayuda { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 28px; max-width: 1100px; align-items: start; }
.ayuda-indice { position: sticky; top: 72px; }
.ayuda-indice ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.ayuda-indice button { width: 100%; text-align: left; background: none; border: 0; padding: 6px 10px; border-radius: var(--radio-s); color: var(--texto-2); cursor: pointer; }
.ayuda-indice button:hover { color: var(--texto); background: var(--panel); }
.ayuda-cuerpo > .nota { margin: -6px 0 16px; }
.ayuda-cuerpo .bib-cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.ayuda-sec { background: var(--panel); border: 1px solid var(--borde); border-radius: var(--radio); margin-bottom: 10px; scroll-margin-top: 72px; }
.ayuda-sec > summary { padding: 14px 16px; font-size: 15px; font-weight: 600; cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px; }
.ayuda-sec > summary::-webkit-details-marker { display: none; }
.ayuda-sec > summary::before { content: "›"; color: var(--texto-3); font-size: 18px; line-height: 1; transition: transform .15s; }
.ayuda-sec[open] > summary::before { transform: rotate(90deg); }
.ayuda-txt { padding: 0 18px 16px 36px; color: var(--texto-2); line-height: 1.6; max-width: 760px; }
.ayuda-txt b, .ayuda-txt dt { color: var(--texto); }
.ayuda-txt p { margin: 0 0 10px; }
.ayuda-txt ul, .ayuda-txt ol { margin: 0 0 10px; padding-left: 20px; }
.ayuda-txt li { margin-bottom: 6px; }
.ayuda-txt code { font: 12px var(--mono); background: var(--panel-2); border: 1px solid var(--borde); border-radius: 4px; padding: 1px 5px; }
.ayuda-txt dt { font-weight: 600; margin-top: 12px; }
.ayuda-txt dd { margin: 4px 0 0; }
.ayuda-aviso { color: var(--aviso); }
.ayuda-tabla { border-collapse: collapse; width: 100%; margin: 6px 0 12px; font-size: 13px; }
.ayuda-tabla th, .ayuda-tabla td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--borde); }
.ayuda-tabla th { color: var(--texto-3); font-weight: 600; font-size: 12px; }
.ayuda-pasos { list-style: none; padding: 0 !important; counter-reset: paso; }
.ayuda-paso { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 18px; align-items: start; padding: 14px 0; border-top: 1px solid var(--borde); }
.ayuda-paso h3 { margin: 0 0 6px; font-size: 14px; color: var(--texto); display: flex; align-items: center; gap: 8px; }
.ayuda-paso h3::before { counter-increment: paso; content: counter(paso); width: 22px; height: 22px; border-radius: 50%; background: var(--acento); color: var(--acento-txt); display: grid; place-items: center; font-size: 12px; flex: none; }
.ayuda-paso img { width: 100%; max-height: 380px; object-fit: contain; object-position: top; border-radius: var(--radio-s); border: 1px solid var(--borde); background: var(--bg); cursor: zoom-in; display: block; }
@media (max-width: 860px) {
  .ayuda { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .ayuda-indice { position: static; }
  .ayuda-indice ol { display: flex; flex-wrap: wrap; gap: 4px; }
  .ayuda-indice button { width: auto; border: 1px solid var(--borde); border-radius: 999px; padding: 5px 10px; font-size: 13px; }
  .ayuda-paso { grid-template-columns: minmax(0, 1fr); }
  .ayuda-paso img { max-width: 360px; }
  .ayuda-txt { padding-left: 18px; }
}

/* ---------- pie de página ---------- */
.pie { text-align: center; padding: 18px 20px 26px; font-size: 12px; color: var(--texto-3); }
.pie a { color: var(--texto-2); text-decoration: none; }
.pie a:hover { color: var(--acento-2); text-decoration: underline; }

/* ---------- toasts y visor ---------- */
.toasts { position: fixed; bottom: 16px; right: 16px; left: 16px; display: grid; justify-items: end; gap: 8px; z-index: 50; pointer-events: none; }
.toast { pointer-events: auto; max-width: 420px; padding: 10px 14px; border-radius: var(--radio-s); background: var(--panel-2); border: 1px solid var(--borde-2); box-shadow: 0 8px 30px rgba(0,0,0,.4); font-size: 13px; animation: entra .2s; }
.toast.error { border-color: #ef646188; color: #ffb3b1; }
.toast.ok { border-color: #4cc38a88; }
.toast .accion { margin-left: 12px; background: none; border: 0; padding: 0; color: var(--acento-2); font-weight: 600; cursor: pointer; }
@keyframes entra { from { opacity: 0; transform: translateY(8px); } }
.visor { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.88); display: grid; place-items: center; padding: 20px; cursor: zoom-out; }
.visor img { max-width: 100%; max-height: 100%; border-radius: var(--radio-s); }
/* ---------- estudio de imágenes ---------- */
.est-cab { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:20px; }
.est-cab h1 { margin-bottom:4px; }
.est-cab p { margin:0; color:var(--texto-2); max-width:720px; }
.est-etiqueta { color:var(--acento-2); border:1px solid var(--borde-2); border-radius:24px; padding:6px 12px; white-space:nowrap; font-size:12px; }
.est-layout { display:grid; grid-template-columns:minmax(280px,360px) minmax(0,1fr); gap:20px; align-items:start; }
.est-form { display:grid; gap:16px; }
.est-form .campo { margin:0; }
.est-form textarea { min-height:155px; resize:vertical; }
.est-par { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.est-foto { display:flex; align-items:center; gap:12px; padding:10px; background:var(--panel-2); border-radius:var(--radio-s); }
.est-foto img { width:70px; height:70px; object-fit:contain; border-radius:6px; }
.est-preview { min-height:400px; height:clamp(400px,55vh,660px); display:grid; place-items:center; border:1px solid var(--borde); border-radius:var(--radio); background:radial-gradient(ellipse at top,#27241d 0%,#111319 65%); overflow:hidden; }
.est-ampliar { border:0; background:transparent; padding:12px; cursor:zoom-in; width:100%; height:100%; min-height:0; display:grid; place-items:center; }
.est-ampliar img { max-width:100%; max-height:100%; object-fit:contain; border-radius:6px; min-height:0; }
.est-vacio { padding:32px 20px; text-align:center; color:var(--texto-2); max-width:560px; margin:auto; }
.est-vacio h2,.est-vacio strong { color:var(--texto); }
.est-vacio p { white-space:pre-wrap; overflow-wrap:anywhere; }
.est-vacio progress { width:min(330px,100%); accent-color:var(--acento); height:8px; }
.est-simbolo { display:block; font-size:48px; color:var(--acento); margin-bottom:16px; }
.est-detalle { padding:16px 0; }
.est-detalle p { margin:0 0 8px; overflow-wrap:anywhere; }
.est-detalle .fila { margin-top:14px; }
.est-galeria-cab { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:26px 0 12px; }
.est-galeria-cab h2 { margin:0; }
.est-galeria { display:grid; grid-template-columns:repeat(auto-fill,minmax(155px,1fr)); gap:12px; }
.est-galeria > .est-vacio { grid-column:1/-1; }
.est-mini { text-align:left; cursor:pointer; padding:0 0 10px; overflow:hidden; background:var(--panel); border:1px solid var(--borde); border-radius:var(--radio-s); transition:border-color .15s; min-width:0; }
.est-mini:hover,.est-mini.seleccionada { border-color:var(--acento); }
.est-mini.seleccionada { box-shadow:0 0 0 1px var(--acento); }
.est-mini img,.est-mini-estado { width:100%; height:145px; object-fit:contain; background:#0a0c10; display:flex; align-items:center; justify-content:center; gap:8px; font-size:12px; }
.est-mini-texto { display:block; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; padding:10px 10px 3px; }
.est-mini small { padding:0 10px; color:var(--texto-2); }
.est-paginas { display:flex; align-items:center; justify-content:center; gap:16px; margin-top:16px; }
@media(max-width:900px) { .est-layout { grid-template-columns:1fr; } .est-cab { align-items:flex-start; } .est-etiqueta { display:none; } .est-preview { height:460px; } }
/* Layout de la estación de producción */
:root { --bg:#111420; --panel:#1a1e2e; --panel-2:#22273a; --borde:#343950; --borde-2:#494d68;
  --texto:#eef0fc; --texto-2:#bfc4dc; --texto-3:#a0a8c4; --acento:#c2afff; --acento-2:#d5caff;
  --acento-txt:#1d1337; --radio:16px; --radio-s:9px; color-scheme:dark; }
header { padding:14px clamp(12px, 3vw, 40px); background:#141827f5; }
.marca { gap:12px; font-size:15px; }
.marca img { height:34px; width:34px; border-radius:9px; }
nav button { border-radius:8px; }
nav button.activa { background:#322c4c; color:#e1d7ff; }
main { padding:22px clamp(14px, 3vw, 42px) 36px; }
.espacio-cabecera { margin:0 0 18px; border-bottom:1px solid var(--borde); padding:0 0 15px; }
.espacio-cabecera h1 { margin:0; font-size:clamp(24px,3vw,36px); line-height:1.1; letter-spacing:-.04em; }
.espacio-cabecera p { margin:8px 0 0; }
.panel { padding:clamp(14px, 1.6vw, 23px); }
.panel > h2 { font-size:15px; letter-spacing:0; text-transform:none; color:var(--texto); }
.ajustes { max-width:none; grid-template-columns:repeat(3,minmax(0,1fr)); align-items:start; }
@media (max-width:1050px) { .ajustes { grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (max-width:640px) { .ajustes { grid-template-columns:minmax(0,1fr); } }
.voz-monitor { display:flex; align-items:center; gap:10px; }
.voz-monitor label { flex:1; min-width:0; }
.voz-monitor > button { margin-top:7px; }
audio { width:100%; margin:8px 0; }
.cierre-muestra { width:100%; max-width:180px; max-height:150px; object-fit:contain; background:var(--bg); border-radius:8px; margin:0 0 12px; }
.prueba-voz { margin:0 0 12px; }
:focus-visible { outline:2px solid var(--acento); outline-offset:3px; }
</style>

<body>
<header>
  <div class="marca"><img src="/logo/compresso.png" alt=""><span>CompressOS Studio</span></div>
  <nav>
    <button data-tab="nuevo" data-i18n="nav.nuevo"></button>
    <button data-tab="biblioteca" data-i18n="nav.biblioteca"></button>
    <button data-tab="personajes" data-i18n="nav.personajes"></button>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const palabras = t => (t || "").trim().split(/\s+/).filter(Boolean).length;
const mmss = s => s == null ? "—" : `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}`;
const hace = ts => {
  const d = (Date.now() / 1000 - ts);
  if (d < 60) return T("comun.ahora");
  if (d < 3600) return T("comun.hace_min", { n: Math.round(d / 60) });
  if (d < 86400) return T("comun.hace_h", { n: Math.round(d / 3600) });
  return new Date(ts * 1000).toLocaleDateString(LANG, { day: "numeric", month: "short", year: "numeric" });
};

const PRESETS = [
  ["preset.cine", "cinematic, dramatic lighting, 35mm film grain, muted teal and amber palette, photorealistic, high detail"],
  ["preset.archivo", "archival documentary photograph, 1970s to 1990s film stock, natural light, faded colors, grain, photorealistic"],
  ["preset.noir", "film noir, high contrast black and white, deep shadows, volumetric light, fog, mysterious, photorealistic"],
  ["preset.inquietante", "dark atmospheric horror, desaturated cold tones, eerie mist, low key lighting, unsettling, photorealistic"],
  ["preset.cosmico", "epic sci-fi concept art, cosmic scale, glowing particles, deep blues and purples, volumetric light, highly detailed"],
  ["preset.ilustracion", "digital painting, graphic novel illustration, bold shapes, dramatic chiaroscuro, rich colors"],
];
const RECOMENDADAS = {
  edge: {
    es: ["es-CO-GonzaloNeural", "es-MX-JorgeNeural", "es-CO-SalomeNeural", "es-MX-DaliaNeural"],
    en: ["en-US-AndrewNeural", "en-US-GuyNeural", "en-US-BrianNeural", "en-US-AriaNeural", "en-US-JennyNeural", "en-GB-RyanNeural"],
  },
  kokoro: { es: ["em_alex", "ef_dora"], en: ["am_michael", "af_heart", "am_fenrir", "af_bella", "bm_george", "bf_emma"] },
};
// en español, la de Ajustes (una por motor); en inglés, esta
const VOZ_DEFECTO = { edge: { en: "en-US-AndrewNeural" }, kokoro: { en: "am_michael" } };
const motorDe = v => /^[a-z]{2}_[a-z]+$/.test(v || "") ? "kokoro" : "edge";
/** El motor de voz de un guion (o borrador): el suyo; si no tiene, el de su voz. */
const motorGuion = d => d.motor_voz || (d.voz ? motorDe(d.voz) : S.ajustes.motor_voz || "edge");
function vozDefecto(motor, idioma) {
  if (idioma === "es") return motor === "kokoro" ? S.ajustes.voz_kokoro : S.ajustes.voz;
  return VOZ_DEFECTO[motor][idioma];
}
/** "am_michael" -> "Michael"; "es-CO-GonzaloNeural" -> "es-CO-Gonzalo" */
const nombreVoz = id => motorDe(id) === "kokoro" ? id.slice(3).replace(/^./, c => c.toUpperCase()) : id.replace("Neural", "");
const estadoTxt = k => (["idea", "guion", "generando", "listo", "error"].includes(k) ? T(`estado.${k}`) : k);

// ---------------- estado ----------------
const S = {
  ajustes: null, voces: [], musica: { moods: [], sueltas: [] }, moodSubir: null,
  slug: null, det: null, doc: null, mtime: null,   // guion abierto (det = respuesta completa del servidor)
  borrador: null,                                   // idea sin guardar todavía (sin slug)
  sucio: false, tGuardar: null, cadena: Promise.resolve(),
  foco: {},                                         // valor de un campo al enfocarlo, para saber si cambió
  escritura: null,                                  // {id, inicio, slug}: guion que Claude está escribiendo
  traduccion: null,                                 // {id, origen}: traducción al inglés en curso
  filtro: "todos", audio: null, tPoll: null,
};

/** Cabeceras de toda petición: X-Idioma hace que el servidor responda sus mensajes en el idioma de la interfaz. */
const cabeceras = (extra = {}) => ({ "X-Idioma": LANG, "X-Dcrypto-Local": "1", ...extra });
const errorHttp = (data, status) => data?.detail || T("comun.error_http", { status });

async function api(metodo, ruta, cuerpo) {
  const r = await fetch(ruta, {
    method: metodo, headers: cabeceras(cuerpo ? { "Content-Type": "application/json" } : {}),
    body: cuerpo ? JSON.stringify(cuerpo) : undefined,
  });
  const data = await r.json().catch(() => null);
  if (r.status === 401) location.assign("/entrar");
  if (!r.ok && r.status !== 409) throw Object.assign(new Error(errorHttp(data, r.status)), { status: r.status });
  return { status: r.status, data };
}

function toast(msg, tipo = "", accion) {
  // accion = { texto, fn, ms }: un botón dentro del aviso (p. ej. "Deshacer"), que dura ms
  const t = document.createElement("div");
  t.className = `toast ${tipo}`;
  t.setAttribute("role", tipo === "error" ? "alert" : "status");
  t.setAttribute("aria-atomic", "true");
  t.textContent = msg;
  if (accion) {
    const b = document.createElement("button");
    b.className = "accion"; b.textContent = accion.texto;
    b.onclick = () => { t.remove(); accion.fn(); };
    t.append(b);
  }
  $("#toasts").append(t);
  setTimeout(() => t.remove(), accion?.ms || (tipo === "error" ? 7000 : 3500));
}

// Una sola decisión pendiente: un doble clic no debe duplicar operaciones.
let dialogoPendiente = false;
function elegirAccion(mensaje, { aceptar = T("dlg.continuar"), alternativa = null } = {}) {
  if (dialogoPendiente) return Promise.resolve(null);
  dialogoPendiente = true;
  const origen = document.activeElement;
  return new Promise(resolve => {
    const dlg = document.createElement("dialog");
    dlg.className = "modal confirmacion";
    dlg.setAttribute("role", "alertdialog");
    dlg.setAttribute("aria-modal", "true");
    dlg.setAttribute("aria-labelledby", "confirmacionTitulo");
    dlg.setAttribute("aria-describedby", "confirmacionMensaje");
    dlg.innerHTML = `<div class="confirmacion-cab"><span class="confirmacion-icono" aria-hidden="true">!</span><h3 id="confirmacionTitulo">${esc(T("dlg.titulo"))}</h3></div>
      <p id="confirmacionMensaje"></p><div class="confirmacion-botones">
      <button type="button" class="btn fantasma" data-decision="cancelar" autofocus>${esc(T("comun.cancelar"))}</button>
      ${alternativa ? `<button type="button" class="btn" data-decision="alternativa">${esc(alternativa)}</button>` : ""}
      <button type="button" class="btn primario" data-decision="aceptar">${esc(aceptar)}</button></div>`;
    $("#confirmacionMensaje", dlg).textContent = mensaje;
    dlg.addEventListener("click", e => {
      const b = e.target.closest("[data-decision]");
      if (b) dlg.close(b.dataset.decision);
    });
    dlg.addEventListener("cancel", e => { e.preventDefault(); dlg.close("cancelar"); });
    dlg.addEventListener("keydown", e => {
      if (e.key !== "Tab") return;
      const botones = $$("button:not([disabled])", dlg), primero = botones[0], ultimo = botones.at(-1);
      if (e.shiftKey && document.activeElement === primero) { e.preventDefault(); ultimo.focus(); }
      else if (!e.shiftKey && document.activeElement === ultimo) { e.preventDefault(); primero.focus(); }
    });
    const terminar = () => {
      const decision = ["aceptar", "alternativa"].includes(dlg.returnValue) ? dlg.returnValue : null;
      dlg.remove();
      dialogoPendiente = false;
      if (origen?.isConnected && !origen.disabled) origen.focus({ preventScroll:true });
      else {
        const padre = $$("dialog[open]").at(-1) || $("main > section:not([hidden])") || document;
        $$("textarea, input:not([disabled]), button:not([disabled]), a[href]", padre)
          .find(el => el.getClientRects().length && !el.closest("[hidden]"))?.focus({ preventScroll:true });
      }
      resolve(decision);
    };
    dlg.addEventListener("close", terminar, { once:true });
    document.body.append(dlg);
    try { dlg.showModal(); $("[data-decision='cancelar']", dlg).focus(); }
    catch { terminar(); }
  });
}
async function confirmarAccion(mensaje, aceptar) {
  return await elegirAccion(mensaje, { aceptar }) === "aceptar";
}

// ---------------- navegación ----------------
function ruta() {
  const [, tab = "nuevo", slug] = location.hash.match(/^#\/?([^/]*)\/?(.*)$/) || [];
  return { tab: tab || "nuevo", slug: decodeURIComponent(slug || "") || null };
}
function ir(tab, slug) { location.hash = slug ? `#/${tab}/${encodeURIComponent(slug)}` : `#/${tab}`; }

function actualizarBusqueda() {
  const tema = $("#fTema").value.trim(), enlace = $("#fBuscarTema");
  enlace.hidden = !tema;
  if (tema) enlace.href = "https://www.google.com/search?" + new URLSearchParams({q: tema});
}
async function alNavegar() {
  const vistaTitulo = ruta().tab;
  if (vistaTitulo === "setup" && S.ajustes?.linux) {
    ir("ajustes");
    return;
  }
  if (vistaTitulo !== S.ultimaVista) window.scrollTo(0, 0);
  S.ultimaVista = vistaTitulo;
  const itemTitulo = document.querySelector(`nav button[data-tab="${CSS.escape(vistaTitulo)}"]`);
  const titulo = $("#tituloVista");
  titulo.dataset.i18n = itemTitulo?.dataset.i18n || "nav.nuevo";
  titulo.textContent = T(titulo.dataset.i18n);
  const { tab, slug } = ruta();
  if (tab === "licencia") return ir("nuevo");  // enlaces de la 1.0.0: la versión gratuita no tiene esa pestaña
  $$("nav button").forEach(b => b.classList.toggle("activa", b.dataset.tab === tab));
  $$("main > section").forEach(s => s.hidden = s.id !== `tab-${tab}`);
  if (tab === "nuevo") {
    if (slug && slug !== S.slug) await abrir(slug);
    else if (!slug && S.slug) nuevo();
  }
  if (tab === "biblioteca") cargarBiblioteca();
  if (tab === "personajes") { renderFormPersonaje(); cargarPersonajes(); }
  if (tab === "estudio") { renderEstudio(); cargarEstudio(true); }
  if (tab === "ajustes") renderAjustes();
  if (tab === "ayuda") renderAyuda();
  if (tab === "setup") cargarSetup(true);
  programarPoll(0);
}

// ---------------- ayuda ----------------
// Textos en i18n.js ("ayuda.<id>" y "ayuda.<id>_html"); las capturas, en app/static/help/ (servidas en /help).
const AYUDA_SECCIONES = ["inicio", "guion", "imagenes", "clips", "personajes", "estudio", "voz", "musica", "subtitulos", "publicar", "ajustes", "sinia", "errores", "requisitos"];
const AYUDA_CAPTURAS = ["1-tema", "2-escenas", "3-musica", "4-generar", "5-descargar"];

/** Las secciones a mostrar: "feedback" solo si app/config.py tiene FEEDBACK_URL (llega en /api/ajustes). */

function renderAyuda() {
  const cont = $("#ayudaSecciones");
  const secciones = seccionesAyuda();
  const feedback = `<p><a class="btn primario" href="${esc(S.ajustes?.feedback_url)}" target="_blank" rel="noopener">${esc(T("ayuda.feedback_btn"))}</a></p>
    <p>${esc(T("ayuda.feedback_txt"))}</p>`;
  // al rehacerla (cambio de idioma) se conservan las secciones abiertas; la primera vez, solo Primeros pasos
  const abiertas = cont.children.length ? new Set($$("details[open]", cont).map(d => d.dataset.sec)) : new Set(["inicio"]);

      <img src="/help/${img}.webp" alt="${esc(T(`ayuda.paso${i + 1}`))}" loading="lazy"></li>`).join("")}</ol>`;

// ---------------- columna 1: Idea ----------------
function datosIdea() { return S.doc || S.borrador; }

/** Guion nuevo en blanco. 'conservar' (voz, motor, idioma, estilo, música) sale del video anterior en
 * "Crear otro video"; si no, todo sale de Ajustes. */
function nuevo(conservar = null) {
  S.slug = S.det = S.doc = S.mtime = null;
  const a = S.ajustes;
  S.borrador = { tema: "", material: "", titulo: "", formato: a.formato, idioma: "es", motor_voz: a.motor_voz, voz: vozDefecto(a.motor_voz, "es"),
    estilo_visual: a.estilo_visual, musica: "", volumen_musica: 0.15, ...(conservar || {}) };
  renderTodo();
}

/** "Crear otro video": formulario limpio con la voz, el estilo y la música del que acaba de terminar. */
function otroVideo() {
  const d = S.doc || {};
  const conservar = {};
  for (const k of ["idioma", "voz", "motor_voz", "estilo_visual", "musica", "volumen_musica"])
    if (d[k] != null && d[k] !== "") conservar[k] = d[k];
  conservar.motor_voz = motorGuion(d);
  nuevo(conservar);
  ir("nuevo");
  $("#fTema").focus();
}

function llenarVoces(sel, actual, idioma = "es", motor = "edge") {
  const voces = S.voces.filter(v => (v.motor || "edge") === motor && (v.locale === idioma || v.locale.startsWith(idioma + "-")));
  const ids = new Set(voces.map(v => v.id));
  const rec = RECOMENDADAS[motor][idioma].filter(v => ids.has(v) || !voces.length);
  const porLocale = {};
  voces.forEach(v => (porLocale[v.locale] ??= []).push(v));
  let html = `<optgroup label="${T("voces.recomendadas")}">${rec.map(v => `<option value="${v}">${esc(nombreVoz(v))}</option>`).join("")}</optgroup>`;
  for (const [loc, vs] of Object.entries(porLocale).sort())
    html += `<optgroup label="${esc(loc)}">${vs.map(v => `<option value="${esc(v.id)}">${esc(nombreVoz(v.id))}${v.genero ? ` · ${T(v.genero === "Female" ? "voces.mujer" : "voces.hombre")}` : ""}</option>`).join("")}</optgroup>`;
  if (actual && !ids.has(actual) && !rec.includes(actual)) html += `<option value="${esc(actual)}">${esc(actual)}</option>`;
  sel.innerHTML = html;
  sel.value = actual;
}

function renderIdea() {
  const d = datosIdea();
  $("#fTema").value = d.tema || "";
  $("#fMaterial").value = d.material || "";
  $("#fTitulo").value = d.titulo || "";
  $("#campoTitulo").hidden = !S.slug;  // en un guion nuevo el título lo pone Claude o el JSON pegado
  $$("#fFormato button").forEach(b => b.classList.toggle("activa", b.dataset.v === (d.formato || "short")));
  $("#fIdioma").value = d.idioma || "es";
  const motor = motorGuion(d);
  llenarVoces($("#fVoz"), d.voz, d.idioma || "es", motor);
  $("#fMotorEtq").textContent = `· ${T(motor === "kokoro" ? "motor.kokoro" : "motor.edge")}`;
  const av = S.slug && S.det?.aviso_voz;
  $("#fVozAviso").hidden = !av;
  $("#fVozAviso").textContent = av || "";
  actualizarBusqueda();
  $("#fProbarVoz").hidden = motor !== "edge";
  $("#fEstilo").value = d.estilo_visual || "";
  $("#fPresets").innerHTML = PRESETS.map(([n, v]) =>
    `<button class="chip ${v === d.estilo_visual ? "activa" : ""}" data-v="${esc(v)}">${T(n)}</button>`).join("");
  renderMusica();
  $("#fPortada").value = d.portada == null ? "" : d.portada ? "si" : "no";
  $("#fPortada").options[0].textContent = T("idea.portada_segun", { valor: T(S.ajustes.portada ? "comun.si" : "comun.no") });
  if (SUBS) { renderSubsGuion(); renderMarcaGuion(); }
  renderCierreGuion();
  const conEscenas = !!(S.slug && S.doc?.escenas?.length);
  $("#bEscribir").hidden = conEscenas;
  $("#reescribirCaja").hidden = !conEscenas;
  $("#bBlanco").hidden = !!S.slug;
  $("#bNuevo").hidden = !S.slug;
  $("#bTraducir").hidden = !conEscenas || (d.idioma || "es") === "en";
  if (!S.traduccion) $("#bTraducir").textContent = T("idea.traducir");
  $("#fSlug").textContent = S.slug ? `guiones/${S.slug}.json` : "";
  botonesEscritura();
}

// ---------------- música ----------------
const MOODS = { tension: "mood.tension", misterio: "mood.misterio", epico: "mood.epico", triste: "mood.triste", neutro: "mood.neutro" };  // id -> clave de texto
const todasLasPistas = () => [...S.musica.moods.flatMap(m => m.pistas), ...S.musica.sueltas];
/** mood de un valor de "musica": el propio mood, o la carpeta de una ruta assets/musica/<mood>/... */
function moodDe(valor) {
  if (MOODS[valor]) return valor;
  const m = (valor || "").match(/^assets\/musica\/([^/]+)\//);
  return m && MOODS[m[1]] ? m[1] : null;
}

function renderMusica() {
  const d = datosIdea(), cat = S.musica, sel = $("#fMusica");
  let html = `<option value="">${T("musica.sin")}</option><optgroup label="${T("musica.por_mood")}">`
    + cat.moods.map(m => `<option value="${m.id}">${T(MOODS[m.id])} · ${m.pistas.length ? Tn("musica.pistas", m.pistas.length) : T("musica.vacia")}</option>`).join("")
    + `</optgroup>`;
  for (const m of cat.moods.filter(m => m.pistas.length))
    html += `<optgroup label="${esc(T("musica.fija", { mood: T(MOODS[m.id]) }))}">${m.pistas.map(p => `<option value="${esc(p.ruta)}">${esc(p.nombre)}</option>`).join("")}</optgroup>`;
  if (cat.sueltas.length)
    html += `<optgroup label="${T("musica.otras")}">${cat.sueltas.map(p => `<option value="${esc(p.ruta)}">${esc(p.nombre)}</option>`).join("")}</optgroup>`;
  if (d.musica && !MOODS[d.musica] && !todasLasPistas().some(p => p.ruta === d.musica))
    html += `<option value="${esc(d.musica)}">${esc(T("musica.no_encontrada", { valor: d.musica }))}</option>`;
  sel.innerHTML = html;
  sel.value = d.musica || "";
  const ms = $("#fMoodSubir");
  ms.innerHTML = Object.entries(MOODS).map(([k, v]) => `<option value="${k}">${T(v)}</option>`).join("");
  ms.value = moodDe(d.musica) || S.moodSubir || "tension";
  $("#fVolCaja").hidden = !d.musica;
  $("#fVol").value = d.volumen_musica ?? 0.15;
  $("#fVolTxt").textContent = `${Math.round((d.volumen_musica ?? 0.15) * 100)}%`;
  renderMusicaInfo();
}

/** La pista que va a sonar: para un mood la elige el servidor por slug (determinista). */
function pistaActual() {
  const v = datosIdea()?.musica;
  if (!v) return null;
  if (MOODS[v]) {
    const m = S.det?.musica;
    if (S.slug && m?.valor === v) return m.pista ? { url: m.pista, nombre: m.nombre } : null;
    const p = S.musica.moods.find(x => x.id === v)?.pistas[0];  // aún sin guardar: una de muestra
    return p ? { url: p.url, nombre: p.nombre } : null;
  }
  const p = todasLasPistas().find(x => x.ruta === v);
  return p ? { url: p.url, nombre: p.nombre } : null;
}

function renderMusicaInfo() {
  const v = datosIdea()?.musica, p = pistaActual();
  let info = "";
  if (MOODS[v] && !S.musica.moods.find(m => m.id === v)?.pistas.length)
    info = `<span class="aviso">${T("musica.carpeta_vacia_html", { mood: T(MOODS[v]) })}</span>`;
  else if (p) info = `${T(MOODS[v] ? "musica.pista_guion" : "musica.pista")}: <b>${esc(p.nombre)}</b>`;
  else if (v) info = `<span class="aviso">${esc(T("musica.no_encuentro", { valor: v }))}</span>`;
  $("#musicaInfo").innerHTML = info;
  $("#bPlayPista").disabled = !p;
  $("#bStopPista").disabled = !p;

  const tp = [...(S.det?.trabajos || [])].reverse().find(t => t.tipo === "prueba");
  const activa = tp && (tp.estado === "en cola" || tp.estado === "corriendo");
  $("#bProbar").disabled = !S.slug || activa;
  $("#bProbar").title = S.slug ? "" : T("musica.primero_guion");
  const caja = $("#pruebaCaja"), pr = S.slug ? S.det?.prueba : null;
  const estado = activa ? `<span class="fila"><span class="giro"></span> ${T(tp.estado === "en cola" ? "musica.prueba_cola" : "musica.prueba_generando")}</span>`
    : tp?.estado === "error" ? `<div class="error-box">${esc(tp.error)}</div>` : "";
  const clave = `${pr?.url || ""}|${estado}`;
  if (caja.dataset.clave !== clave) {  // no recrear el <video> en cada sondeo: cortaría la reproducción
    caja.dataset.clave = clave;
    caja.innerHTML = estado + (pr ? `<video src="${esc(pr.url)}#t=0.1" controls playsinline preload="metadata"></video>` : "");
  }
}

function tocarPista() {
  const p = pistaActual();
  if (!p) return;
  S.audio?.pause();
  S.audio = new Audio(p.url);
  S.audioSrc = p.url;
  S.audio.play().catch(() => toast(T("musica.no_suena"), "error"));
}
function pararAudio() { S.audio?.pause(); }

async function subirMusica(archivos) {
  if (!archivos.length) return;
  const mood = $("#fMoodSubir").value;
  const fd = new FormData();
  fd.append("mood", mood);
  for (const f of archivos) fd.append("archivos", f);
  const b = $("#bSubir");
  b.disabled = true; b.innerHTML = `<span class="giro"></span> ${T("musica.subiendo")}`;
  try {
    const r = await fetch("/api/musica/subir", { method: "POST", body: fd, headers: cabeceras() });
    const data = await r.json().catch(() => null);
    if (!r.ok) throw new Error(errorHttp(data, r.status));
    S.musica = { moods: data.moods, sueltas: data.sueltas };
    S.moodSubir = mood;
    if (!datosIdea().musica) cambiarIdea("musica", mood);
    renderMusica();
    toast(Tn("musica.subidas", data.guardadas.length, { mood: T(MOODS[mood]) }), "ok");
    data.errores.forEach(e => toast(e, "error"));
  } catch (e) { toast(e.message, "error"); }
  finally { b.disabled = false; b.textContent = T("musica.subir"); $("#fArchivos").value = ""; }
}

function cambiarIdea(campo, valor) {
  const d = datosIdea();
  d[campo] = valor;
  if (S.slug) guardarLuego();
  if (campo === "formato") renderGuion();
}

/** Parámetros fijos de la columna Idea que viajan con el guion. */
function parametrosIdea() {
  const d = datosIdea();
  const p = {};
  for (const k of ["tema", "material", "formato", "idioma", "voz", "motor_voz", "estilo_visual", "musica", "volumen_musica", "portada", "subtitulos", "marca"])
    if (d[k] !== undefined && d[k] !== "") p[k] = d[k];
  return p;
}

function botonesEscritura() {
  const ocupado = !!S.escritura || !!S.traduccion, ia = !!S.ajustes?.ia?.disponible;
  for (const id of ["#bPegar", "#bBlanco"]) $(id).disabled = ocupado;
  // sin proveedor de IA siguen activos: abren "Escribir el guion con tu IA" / "Traducir sin IA integrada"
  for (const id of ["#bEscribir", "#bReescribir", "#bTraducir"]) {
    $(id).disabled = ocupado;
    $(id).title = ia ? "" : T("idea.sin_ia");
  }
  $("#sinIA").hidden = ia;
}

async function escribirGuion(reescribir) {
  const p = parametrosIdea();
  if (!(p.tema || "").trim() && !(p.material || "").trim()) { toast(T("esc.falta_tema"), "error"); $("#fTema").focus(); return; }
  if (!S.ajustes?.ia?.disponible) {
    if (reescribir) await guardar();
    return abrirPromptManual({ ...p, ...(reescribir ? { slug: S.slug, nota: $("#fNota").value.trim() } : {}) });
  }
  if (reescribir) {
    if (!await confirmarAccion(T("esc.confirmar_reescribir", { titulo: S.doc.titulo || S.slug }), T("dlg.reescribir"))) return;
    await guardar();
  }
  try {
    const cuerpo = { ...p, ...(reescribir ? { slug: S.slug, nota: $("#fNota").value.trim() } : {}) };
    const { data } = await api("POST", "/api/escribir", cuerpo);
    S.escritura = { id: data.id, inicio: Date.now(), slug: reescribir ? S.slug : null, log: [] };
    botonesEscritura();
    renderGuion();
    sondearEscritura();
  } catch (e) { toast(e.message, "error"); }
}

async function sondearEscritura() {
  const w = S.escritura;
  if (!w) return;
  let t;
  try { t = (await api("GET", `/api/trabajos/${w.id}`)).data; }
  catch (e) { S.escritura = null; botonesEscritura(); renderGuion(); toast(e.message, "error"); return; }
  if (S.escritura !== w) return;  // cancelado mientras tanto
  w.log = t.log;
  if (t.estado === "corriendo") {
    renderEscribiendo();
    setTimeout(sondearEscritura, 1500);
    return;
  }
  S.escritura = null;
  botonesEscritura();
  if (t.estado === "listo" && t.resultado?.slug) {
    $("#fNota").value = "";
    await abrirEscrito(t.resultado.slug, t.resultado.avisos);
  } else if (t.estado === "listo" && t.resultado?.existe) {
    await resolverExistente(t.resultado);
  } else if (t.estado === "error" && t.resultado?.crudo) {
    renderGuion();
    abrirPegar(t.resultado.crudo, [t.error, T("esc.arreglalo")]);
  } else if (t.estado === "error") {
    renderGuion();
    toast(t.error, "error");
  } else {
    renderGuion();  // cancelado
  }
}

async function cancelarEscritura() {
  const w = S.escritura;
  if (!w) return;
  S.escritura = null;
  botonesEscritura();
  renderGuion();
  try { await api("POST", `/api/trabajos/${w.id}/cancelar`); toast(T("esc.cancelada")); } catch { /* ya había terminado */ }
}

async function abrirEscrito(slug, avisos) {
  const { data } = await api("GET", `/api/guiones/${encodeURIComponent(slug)}`);
  S.borrador = null;
  cargarDetalle(data, true);
  history.replaceState(null, "", `#/nuevo/${encodeURIComponent(slug)}`);
  toast(Tn("esc.listo", data.doc.escenas.length), "ok");
  (avisos || []).forEach(a => toast(T("comun.revisa", { aviso: a })));
}

/** Un guion nuevo cuyo slug ya existe: nunca se pisa sin preguntar. */
async function resolverExistente(r) {
  const cuerpo = { guion: r.guion, base: r.base || parametrosIdea() };
  const decision = await elegirAccion(T("esc.existe", { titulo: r.titulo || r.existe, slug: r.existe }), { aceptar:T("dlg.reemplazar"), alternativa:T("dlg.copia") });
  if (!decision) return;
  if (decision === "aceptar") cuerpo.reemplazar = true;
  else cuerpo.copia = true;
  const res = await fetch("/api/guiones/importar", { method: "POST", headers: cabeceras({ "Content-Type": "application/json" }), body: JSON.stringify(cuerpo) });
  const data = await res.json();
  if (!res.ok) { toast((data.errores || [data.detail]).join(" · "), "error"); return; }
  await abrirEscrito(data.slug, data.avisos);
}

function renderEscribiendo() {
  const w = S.escritura, cont = $("#guionCuerpo");
  if (!w) return;
  const seg = Math.round((Date.now() - w.inicio) / 1000);
  if (!$(".escribiendo", cont)) {
    cont.innerHTML = `<div class="escribiendo">
      <span class="giro"></span>
      <h4>${T(w.slug ? "esc.reescribiendo" : "esc.escribiendo")}</h4>
      <div class="reloj" id="escReloj"></div>
      <ul id="escLog"></ul>
      <button class="btn" id="bCancelarEsc">${T("comun.cancelar")}</button></div>`;
  }
  $("#escReloj").textContent = mmss(seg);
  $("#escLog").innerHTML = (w.log || []).map(l => `<li>· ${esc(l)}</li>`).join("");
}

// ---------------- traducir ----------------
async function traducir(reemplazar = false) {
  if (!S.ajustes?.ia?.disponible) return abrirTraduccionManual();
  await guardar();
  const origen = S.slug;
  let r;
  try { r = await api("POST", `/api/guiones/${encodeURIComponent(origen)}/traducir`, reemplazar ? { reemplazar: true } : {}); }
  catch (e) { toast(e.message, "error"); return; }
  if (r.status === 409) {
    if (!r.data.existe) { toast(r.data.detail || T("tr.no_ahora"), "error"); return; }
    if (await confirmarAccion(T("tr.existe", { titulo: r.data.titulo || r.data.existe, slug: r.data.existe }), T("dlg.reemplazar")))
      return traducir(true);
    return;
  }
  S.traduccion = { id: r.data.id, origen };
  const b = $("#bTraducir");
  b.innerHTML = `<span class="giro"></span> ${T("tr.traduciendo")}`;
  botonesEscritura();
  sondearTraduccion();
}

async function sondearTraduccion() {
  const w = S.traduccion;
  if (!w) return;
  let t;
  try { t = (await api("GET", `/api/trabajos/${w.id}`)).data; }
  catch (e) { t = { estado: "error", error: e.message }; }
  if (t.estado === "corriendo") { setTimeout(sondearTraduccion, 1500); return; }
  S.traduccion = null;
  $("#bTraducir").textContent = T("idea.traducir");
  botonesEscritura();
  if (t.estado === "listo" && t.resultado?.slug) {
    toast(T("tr.lista"), "ok");
    (t.resultado.avisos || []).forEach(a => toast(T("comun.revisa", { aviso: a })));
    ir("nuevo", t.resultado.slug);
  } else if (t.estado === "error") toast(t.error, "error");
}

// ---------------- sin IA integrada ----------------
/** Copia el contenido de un textarea. Por http desde otro equipo de la red no hay navigator.clipboard:
 *  entonces se selecciona y se usa execCommand; si tampoco, queda seleccionado para Ctrl+C. */
async function copiarDe(ta, ok) {
  let copiado = false;
  try { await navigator.clipboard.writeText(ta.value); copiado = true; }
  catch {
    ta.focus(); ta.select();
    try { copiado = document.execCommand("copy"); } catch { /* sin portapapeles */ }
  }
  toast(copiado ? ok : T("copiar.fallo"), copiado ? "ok" : "error");
}

/** "Generar guion con IA" / "Reescribir" sin proveedor: el prompt de app/escribir.py para copiarlo a otra IA. */
async function abrirPromptManual(cuerpo) {
  try {
    const { data } = await api("POST", "/api/escribir/prompt", cuerpo);
    $("#promptTexto").value = data.prompt;
    $("#dlgPrompt").showModal();
    $("#promptTexto").scrollTop = 0;
  } catch (e) { toast(e.message, "error"); }
}

/** El guion como texto para traducir fuera: etiquetas en inglés (el idioma de destino, así no las cambian),
 *  una escena por línea, numeradas. El servidor lo lee con app/escribir.py: leer_traduccion_manual(). */
function textoParaTraducir(d) {
  const una = t => (t || "").replace(/\s+/g, " ").trim();
  return [`Title: ${una(d.titulo)}`, `Thumbnail title: ${una(d.titulo_miniatura)}`, "",
    ...(d.escenas || []).map((e, i) => `${i + 1}. ${una(e.texto)}`)].join("\n");
}

async function abrirTraduccionManual() {
  await guardar();
  if (!S.doc?.escenas?.length || !S.doc.escenas.every(e => (e.texto || "").trim())) {
    toast(T("srv.traducir_textos"), "error"); return;
  }
  $("#trOrigen").value = textoParaTraducir(S.doc);
  $("#trOrigen").scrollTop = 0;
  $("#trPegar").value = "";
  mostrarErroresTr([]);
  $("#dlgTraducir").showModal();
  $("#bTrCopiar").focus();
}

function mostrarErroresTr(errores) {
  const ul = $("#trErrores");
  ul.innerHTML = errores.map(e => `<li>${esc(e)}</li>`).join("");
  ul.hidden = !errores.length;
}

async function enviarTraduccion(reemplazar = false) {
  const origen = S.slug, b = $("#bTrOk");
  b.disabled = true;
  try {
    const res = await fetch(`/api/guiones/${encodeURIComponent(origen)}/traducir/manual`, {
      method: "POST", headers: cabeceras({ "Content-Type": "application/json" }),
      body: JSON.stringify({ texto: $("#trPegar").value, ...(reemplazar ? { reemplazar: true } : {}) }),
    });
    const data = await res.json().catch(() => null);
    if (res.status === 409 && data?.existe) {
      if (await confirmarAccion(T("tr.existe", { titulo: data.titulo || data.existe, slug: data.existe }), T("dlg.reemplazar"))) return enviarTraduccion(true);
      return;
    }
    if (!res.ok) {
      // qué escenas del original faltan, con su texto, para encontrarlas rápido en la traducción
      const faltan = (data?.faltan || []).map(n => T("tr.manual.falta_escena",
        { n, texto: recorte(S.doc.escenas[n - 1]?.texto || "", 80) }));
      mostrarErroresTr([...(data?.errores || [errorHttp(data, res.status)]), ...faltan]);
      return;
    }
    $("#dlgTraducir").close();
    toast(T("tr.lista"), "ok");
    (data.avisos || []).forEach(a => toast(T("comun.revisa", { aviso: a })));
    ir("nuevo", data.slug);
  } catch (e) { mostrarErroresTr([e.message]); }
  finally { b.disabled = false; }
}

const recorte = (t, n) => t.length > n ? `${t.slice(0, n - 1).trimEnd()}…` : t;

// ---------------- pegar guion ----------------
function abrirPegar(texto = "", errores = []) {
  $("#fPegar").value = texto;
  mostrarErroresPegar(errores);
  $("#dlgPegar").showModal();
  $("#fPegar").focus();
}

function mostrarErroresPegar(errores) {
  const ul = $("#pegarErrores");
  ul.innerHTML = errores.map(e => `<li>${esc(e)}</li>`).join("");
  ul.hidden = !errores.length;
}

async function enviarPegado(extra = {}) {
  const b = $("#bPegarOk");
  b.disabled = true;
  try {
    const res = await fetch("/api/guiones/importar", {
      method: "POST", headers: cabeceras({ "Content-Type": "application/json" }),
      body: JSON.stringify({ texto: $("#fPegar").value, base: parametrosIdea(), ...extra }),
    });
    const data = await res.json();
    if (res.status === 409) {
      const decision = await elegirAccion(T("esc.existe", { titulo: data.titulo || data.existe, slug: data.existe }), { aceptar:T("dlg.reemplazar"), alternativa:T("dlg.copia") });
      if (!decision) return;
      if (decision === "aceptar")
        return enviarPegado({ reemplazar: true });
      return enviarPegado({ copia: true });
    }
    if (!res.ok) { mostrarErroresPegar(data.errores || [errorHttp(data, res.status)]); return; }
    $("#dlgPegar").close();
    await abrirEscrito(data.slug, data.avisos);
  } catch (e) { mostrarErroresPegar([e.message]); }
  finally { b.disabled = false; }
}

async function empezarEnBlanco() {
  const d = { ...S.borrador, escenas: [{ texto: "", prompt: "" }] };
  if (!d.titulo.trim()) d.titulo = d.tema.trim() || T("guion.sin_titulo");
  try {
    const { data } = await api("POST", "/api/guiones", d);
    S.borrador = null;
    cargarDetalle(data, true);
    history.replaceState(null, "", `#/nuevo/${encodeURIComponent(data.slug)}`);
    $(".escena textarea.texto")?.focus();
  } catch (e) { toast(e.message, "error"); }
}

// ---------------- guion abierto ----------------
async function abrir(slug) {
  try {
    const { data } = await api("GET", `/api/guiones/${encodeURIComponent(slug)}`);
    cargarDetalle(data, true);
  } catch (e) { toast(e.message, "error"); ir("nuevo"); }
}

function cargarDetalle(d, completo) {
  S.det = d; S.slug = d.slug; S.mtime = d.mtime;
  if (completo) {
    S.doc = structuredClone(d.doc);
    S.doc.escenas ??= [];
    renderTodo();
  } else {
    actualizarEstados();
  }
}

function guardarLuego() {
  S.sucio = true;
  $("#estadoGuardado").textContent = T("guion.editando");
  clearTimeout(S.tGuardar);
  S.tGuardar = setTimeout(guardar, 800);
}

function guardar() {
  clearTimeout(S.tGuardar);
  S.cadena = S.cadena.then(async () => {
    if (!S.sucio || !S.slug) return;
    S.sucio = false;
    $("#estadoGuardado").textContent = T("guion.guardando");
    const { status, data } = await api("PUT", `/api/guiones/${S.slug}`, { doc: S.doc, mtime: S.mtime });
    if (status === 409) {
      toast(T("guion.conflicto"), "error");
      cargarDetalle(data, true);
    } else {
      cargarDetalle(data, false);
    }
    $("#estadoGuardado").textContent = T("guion.guardado");
  }).catch(e => { S.sucio = true; $("#estadoGuardado").textContent = T("guion.sin_guardar"); toast(e.message, "error"); });
  return S.cadena;
}

async function generar(tipo, escena) {
  await guardar();
  try {
    const { data } = await api("POST", `/api/guiones/${S.slug}/generar`, { tipo, escena });
    cargarDetalle(data, false);
    programarPoll(0);
  } catch (e) { toast(e.message, "error"); }
}

// ---------------- columna 2: Guion ----------------
function trabajosActivos() { return (S.det?.trabajos || []).filter(t => t.estado === "en cola" || t.estado === "corriendo"); }

/** Qué está haciendo el worker con la escena i (1-based): {voz, img} = "en cola" | "corriendo" | null */
function ocupado(i) {
  const r = { voz: null, img: null };
  for (const t of trabajosActivos()) {
    if (t.tipo === "voz" && t.escena === i) r.voz = t.estado;
    if (t.tipo === "imagen" && t.escena === i) r.img = t.estado;
    if (t.tipo === "video") {
      const p = id => t.pasos.find(x => x.id === id)?.estado;
      if (t.estado === "en cola") { r.voz ??= "en cola"; r.img ??= "en cola"; }
      if (p(`voz-${i}`) === "corriendo") r.voz = "corriendo";
      if (p(`img-${i}`) === "corriendo") r.img = "corriendo";
    }
  }
  return r;
}

function renderGuion() {
  const cont = $("#guionCuerpo");
  if (S.escritura) { renderEscribiendo(); return; }
  if (!S.slug) {
    cont.innerHTML = `<div class="vacio-guion"><h4>${T("guion.empieza")}</h4><p>${T("guion.empieza_html")}</p></div>`;
    $("#estadoGuardado").textContent = "";
    return;
  }
  const d = S.doc, esc_ = d.escenas;
  if (!esc_.length) {
    cont.innerHTML = `<div class="vacio-guion"><h4>${esc(d.titulo || d.tema || S.slug)}</h4>
      <p>${T("guion.sin_escenas")}</p>
      <p class="nota">${T("guion.sin_escenas_html")}</p>
      <button class="btn anadir" data-accion="anadir" data-i="-1" style="max-width:260px">${T("guion.anadir")}</button></div>`;
    return;
  }
